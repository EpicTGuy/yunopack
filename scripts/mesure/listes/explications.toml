# Explications etablies a la main, apres analyse d'un echec.
#
# Une entree n'a sa place ici que si la cause a ete verifiee et qu'elle ne
# releve pas de yunopack : une incompatibilite avec YunoHost ou ses regles de
# packaging (« incompatible »), ou un defaut du projet lui-meme (« amont »).
# Un echec que yunopack pourrait lever n'y entre pas : il reste a debloquer.

[aliasvault]
categorie = "incompatible"
etat = "RUN002"
cause = "application .NET : YunoHost ne fournit pas ce langage, et l'amont ne publie pas de binaire autonome pour Debian"

[azuracast]
categorie = "incompatible"
etat = "image"
cause = "suite radio qui assemble dans son image mariadb, supervisor et des services de diffusion par une vingtaine de scripts propres a l'image"

[linguacafe]
categorie = "amont"
etat = "construction"
cause = "pas de package-lock.json : npm install tire un webpack recent, incompatible avec le laravel-mix 6 du projet (module webpack/lib/SizeFormatHelpers absent)"

[gogocarto]
categorie = "amont"
etat = "construction"
cause = "le champ name de composer.json ne respecte pas le schema de Composer, que Composer 2 impose ; Composer 1 n'est plus maintenu"

# Des depots qui ne sont pas une application a installer : un cadre, une
# bibliotheque ou une application de bureau. Un paquet YunoHost installe un
# service ; il n'y a ici rien a faire tourner sur un serveur.

[docusaurus]
categorie = "incompatible"
etat = "pas une application"
cause = "generateur de sites statiques : le depot est l'outil, chaque site se cree a part avec create-docusaurus"

[strapi]
categorie = "incompatible"
etat = "pas une application"
cause = "cadre de CMS : le depot est le cadre et ses paquets ; une application se cree avec create-strapi-app"

[decap-cms]
categorie = "incompatible"
etat = "pas une application"
cause = "CMS en JavaScript integre a un site statique et adosse a un depot git : aucun serveur propre"

[altcha]
categorie = "incompatible"
etat = "pas une application"
cause = "bibliotheque de captcha (widget) a integrer dans un site, pas un service"

[decidim]
categorie = "incompatible"
etat = "pas une application"
cause = "moteur Rails distribue en gemmes : une application se genere avec la commande decidim"

[jan]
categorie = "incompatible"
etat = "application de bureau"
cause = "application de bureau (Tauri) qui fait tourner des modeles en local, sans composant serveur"

[brandcraft]
categorie = "amont"
etat = "depot disparu"
cause = "le depot github.com/sevleo/BrandCraft n'existe plus (404) : supprime ou rendu prive"

[ephemera]
categorie = "amont"
etat = "depot disparu"
cause = "le depot github.com/OrwellianEpilogue/ephemera n'existe plus (404) : supprime ou rendu prive"

[webhook-site]
categorie = "amont"
etat = "construction"
cause = "depend de node-sass 4.12, abandonne par l'amont : il ne se compile qu'avec Node <= 12 et Python 2, absents de Debian 12 (constate sur la VM : gyp cherche python2)"

[pinry]
categorie = "amont"
etat = "service"
cause = "l'application importe collections.Mapping, retire en Python 3.10 : elle exige un Python <= 3.9, en fin de vie (son image part de python:3.7-stretch) ; constate sur le Dell avec le Python 3.11 de Debian 12"

[docuseal]
categorie = "amont"
etat = "service"
cause = "libpdfium n'est publie par l'amont (docusealco/pdfium-binaries) qu'en version musl, pour Alpine : la glibc de Debian ne peut pas le charger (« Function 'FPDF_InitLibraryWithConfig' not found »). Tout le reste du paquet passe : installation, polices, modele, demarrage de puma"

[fishnet]
categorie = "incompatible"
etat = "pas un service web"
cause = "client de calcul benevole pour lichess.org (analyse Stockfish distribuee) : il se connecte a un service tiers et n'expose aucune interface a heberger"

[trivy]
categorie = "incompatible"
etat = "outil en ligne de commande"
cause = "analyseur de vulnerabilites lance ponctuellement (integration continue, poste de travail) : pas un service a heberger derriere nginx"
