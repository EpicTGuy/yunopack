# Reconnaissance d'une licence a l'en-tete de son fichier.
#
# GitHub rend « NOASSERTION » des qu'il ne sait pas classer un LICENSE — c'est
# le cas de gotify, dont le fichier commence pourtant par « MIT License ».
# Sans cette table, ces depots seraient refuses a tort par la regle LIC001.
#
# Ce n'est pas de la devinette : on exige que *tous* les marqueurs soient
# presents dans l'en-tete, et les textes de licence sont standardises.
# L'ordre compte : les licences dont l'en-tete en prefixe une autre d'abord
# (AGPL avant GPL, LGPL avant GPL).

# Licences non libres, en premier : leur texte cite souvent une licence libre
# (« Change License: GNU Affero General Public License » dans une BSL), qui
# ne doit pas l'emporter. Elles sont refusees sous leur nom, pas comme
# « non identifiables ».
[[licence]]
spdx = "BUSL-1.1"
marqueurs = ["business source license"]

[[licence]]
spdx = "SSPL-1.0"
marqueurs = ["server side public license"]

[[licence]]
spdx = "LicenseRef-Commons-Clause"
marqueurs = ["commons clause"]

[[licence]]
spdx = "CC-BY-NC-SA-4.0"
marqueurs = ["attribution-noncommercial-sharealike 4.0"]

[[licence]]
spdx = "CC-BY-NC-4.0"
marqueurs = ["attribution-noncommercial 4.0"]

[[licence]]
spdx = "Elastic-2.0"
marqueurs = ["elastic license 2.0"]

# Coeur libre et parties commerciales (« open core ») : ni refus ni accord,
# une verification a la main, comme toute licence hors de la liste.
[[licence]]
spdx = "LicenseRef-open-core"
marqueurs = ["license.enterprise"]

[[licence]]
spdx = "LicenseRef-open-core"
marqueurs = ["commercial license", "portions of this software"]

[[licence]]
spdx = "LicenseRef-open-core"
marqueurs = ["each", "package has its own license", "gplv3"]

# Une licence libre modifiee n'est plus elle-meme : a verifier.
[[licence]]
spdx = "LicenseRef-EUPL-1.2-modifiee"
marqueurs = ["modified version of european union public license"]

[[licence]]
spdx = "Artistic-1.0-Perl OR GPL-1.0-or-later"
marqueurs = ["same terms as the perl 5"]

[[licence]]
spdx = "ECL-2.0"
marqueurs = ["educational community license", "version 2.0"]

[[licence]]
spdx = "AGPL-3.0-or-later"
marqueurs = ["gnu affero general public license", "version 3"]

[[licence]]
spdx = "LGPL-3.0-or-later"
marqueurs = ["gnu lesser general public license", "version 3"]

[[licence]]
spdx = "LGPL-2.1-or-later"
marqueurs = ["gnu lesser general public license", "version 2.1"]

[[licence]]
spdx = "GPL-3.0-or-later"
marqueurs = ["gnu general public license", "version 3"]

[[licence]]
spdx = "GPL-2.0-or-later"
marqueurs = ["gnu general public license", "version 2"]

[[licence]]
spdx = "Apache-2.0"
marqueurs = ["apache license", "version 2.0"]

[[licence]]
spdx = "MPL-2.0"
marqueurs = ["mozilla public license", "2.0"]

[[licence]]
spdx = "MIT"
marqueurs = ["mit license"]

[[licence]]
spdx = "MIT"
marqueurs = ["permission is hereby granted, free of charge"]

[[licence]]
spdx = "ISC"
marqueurs = ["isc license"]

[[licence]]
spdx = "BSD-3-Clause"
marqueurs = ["redistribution and use in source and binary forms", "neither the name"]

[[licence]]
spdx = "BSD-2-Clause"
marqueurs = ["redistribution and use in source and binary forms"]

[[licence]]
spdx = "Unlicense"
marqueurs = ["this is free and unencumbered software released into the public domain"]

[[licence]]
spdx = "CC0-1.0"
marqueurs = ["creative commons", "cc0"]

[[licence]]
spdx = "WTFPL"
marqueurs = ["do what the fuck you want to public license"]

[[licence]]
spdx = "EUPL-1.2"
marqueurs = ["european union public licence", "1.2"]

[[licence]]
spdx = "EUPL-1.2"
marqueurs = ["european union public license", "1.2"]

# Identifiants SPDX obsoletes, tels que les rend encore GitHub, et leur
# equivalent actuel. Sans cette table, nos manifests annoncent une licence
# dans une forme que SPDX a retiree — les paquets officiels emploient la
# forme moderne.
[obsoletes]
"AGPL-3.0" = "AGPL-3.0-only"
"GPL-3.0" = "GPL-3.0-only"
"GPL-2.0" = "GPL-2.0-only"
"LGPL-3.0" = "LGPL-3.0-only"
"LGPL-2.1" = "LGPL-2.1-only"
"GPL-3.0+" = "GPL-3.0-or-later"
"GPL-2.0+" = "GPL-2.0-or-later"
"LGPL-3.0+" = "LGPL-3.0-or-later"
"AGPL-3.0+" = "AGPL-3.0-or-later"
