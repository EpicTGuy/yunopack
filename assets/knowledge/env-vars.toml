# Role canonique des variables de configuration.
#
# Reconnaitre qu'une variable nommee DATABASE_URL porte l'adresse de la base est
# ce qui permet de cabler la configuration de l'application sur les valeurs
# YunoHost sans rien deviner. C'est de la donnee, pas de l'intelligence : chaque
# entree vient d'une application reelle.
#
# L'ordre compte : la premiere regle qui correspond gagne. Les roles les plus
# specifiques doivent donc precer les plus generaux.

# Les suffixes rattrapent les variantes prefixees du nom de l'application, tres
# repandues : GOTIFY_DATABASE_CONNECTION, NEXTCLOUD_DB_HOST, PAPERLESS_DBUSER.
# Sans eux, une application qui nomme correctement ses variables etait declaree
# indeterminable au seul motif qu'elle les prefixe.
[[rule]]
role = "database_url"
exact = [
  "DATABASE_URL", "DATABASE_URI", "DB_URL", "DB_URI", "DB_CONNECTION_STRING",
  "POSTGRES_URL", "POSTGRESQL_URL", "MYSQL_URL", "MONGO_URL", "MONGODB_URI",
  "SQLALCHEMY_DATABASE_URI", "DATABASE_CONNECTION",
  "SQL_ALCHEMY_CONN",
]
suffix = [
  "_DATABASE_URL", "_DATABASE_URI", "_DB_URL", "_DB_URI",
  "_DATABASE_CONNECTION", "_DATABASE_DSN", "_DB_DSN",
  # Airflow : AIRFLOW__DATABASE__SQL_ALCHEMY_CONN.
  "_SQL_ALCHEMY_CONN", "_SQLALCHEMY_DATABASE_URI",
]

# Le moteur de base : sans lui, l'application retombe sur son defaut, souvent
# SQLite. Strapi a DATABASE_CLIENT=sqlite, Laravel DB_CONNECTION=sqlite.
[[rule]]
role = "database_type"
exact = [
  "DB_CONNECTION", "DATABASE_CLIENT", "DB_CLIENT", "DB_TYPE", "DATABASE_TYPE",
  "DB_DIALECT", "DATABASE_DIALECT", "DB_ENGINE", "DATABASE_ENGINE",
]
suffix = ["_DB_TYPE", "_DATABASE_TYPE", "_DB_CLIENT", "_DATABASE_CLIENT", "_DB_DIALECT"]

[[rule]]
role = "database_host"
exact = ["DB_HOST", "DATABASE_HOST", "POSTGRES_HOST", "MYSQL_HOST", "PGHOST", "DB_SERVER"]
suffix = ["_DB_HOST", "_DATABASE_HOST", "_DBHOST"]

[[rule]]
role = "database_name"
exact = ["DB_NAME", "DATABASE_NAME", "POSTGRES_DB", "MYSQL_DATABASE", "PGDATABASE", "DB_DATABASE"]
suffix = ["_DB_NAME", "_DATABASE_NAME", "_DBNAME"]

[[rule]]
role = "database_user"
exact = ["DB_USER", "DB_USERNAME", "DATABASE_USER", "POSTGRES_USER", "MYSQL_USER", "PGUSER"]
suffix = ["_DB_USER", "_DATABASE_USER", "_DBUSER", "_DB_USERNAME"]

[[rule]]
role = "database_password"
exact = [
  "DB_PASSWORD", "DB_PASS", "DATABASE_PASSWORD", "POSTGRES_PASSWORD",
  "MYSQL_PASSWORD", "MYSQL_ROOT_PASSWORD", "PGPASSWORD",
]

# Pas de terminaison `_PORT` generique : elle attrapait `DB_PORT`, `SMTP_PORT`,
# `REDIS_PORT`, `PROMETHEUS_PORT` — le port d'un autre service. Le premier
# trouve l'emportant, un depot qui listait `DB_PORT` avant `PORT` aurait vu le
# port reserve par YunoHost ecrit dans la connexion a sa base. Les variables
# prefixees du nom de l'application (`GITEA_HTTP_PORT`) sont reconnues a part,
# par `config::reconnaitre_le_port_prefixe`, qui connait le nom du depot.
[[rule]]
role = "port"
exact = [
  "PORT", "HTTP_PORT", "SERVER_PORT", "APP_PORT", "LISTEN_PORT", "WEB_PORT",
  "BIND_PORT", "HTTP_LISTEN_PORT", "SERVICE_PORT", "API_PORT", "BACKEND_PORT",
  "WEBSERVER_PORT", "WEB_SERVER_PORT", "HTTP_SERVER_PORT", "APPLICATION_PORT",
]

[[rule]]
role = "base_url"
exact = [
  "APP_URL", "BASE_URL", "PUBLIC_URL", "SITE_URL", "EXTERNAL_URL", "ROOT_URL",
  "NEXTAUTH_URL", "APP_BASE_URL", "URL", "CANONICAL_URL", "SERVER_URL",
  "PUBLIC_ORIGIN", "ORIGIN", "HOSTNAME", "DOMAIN", "APP_DOMAIN",
]

[[rule]]
role = "admin_email"
exact = ["ADMIN_EMAIL", "INITIAL_ADMIN_EMAIL", "DEFAULT_ADMIN_EMAIL", "SUPERUSER_EMAIL"]

[[rule]]
role = "admin_user"
exact = ["ADMIN_USER", "ADMIN_USERNAME", "INITIAL_ADMIN_USER", "SUPERUSER_USERNAME"]

[[rule]]
role = "admin_password"
exact = ["ADMIN_PASSWORD", "INITIAL_ADMIN_PASSWORD", "SUPERUSER_PASSWORD", "DEFAULT_ADMIN_PASSWORD"]

[[rule]]
role = "data_path"
exact = ["DATA_DIR", "DATA_PATH", "STORAGE_PATH", "UPLOAD_DIR", "MEDIA_ROOT", "FILES_DIR", "STORAGE_DIR"]

[[rule]]
role = "smtp_host"
exact = ["SMTP_HOST", "MAIL_HOST", "EMAIL_HOST", "MAILER_DSN"]

[[rule]]
role = "log_level"
exact = ["LOG_LEVEL", "LOGLEVEL", "RUST_LOG", "DEBUG_LEVEL"]

# Valeurs a generer aleatoirement plutot qu'a recopier depuis l'exemple amont :
# un secret present dans un .env.example est, par construction, public.
[[rule]]
role = "secret"
contains = ["SECRET", "PASSWORD", "PASSWD", "TOKEN", "PRIVATE_KEY", "API_KEY", "ENCRYPTION_KEY", "SALT"]
