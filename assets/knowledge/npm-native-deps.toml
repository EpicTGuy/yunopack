# Modules npm qui compilent du code natif et exigent donc des paquets Debian.
#
# Un `npm ci` qui echoue sur une instance YunoHost tient presque toujours a une
# bibliotheque -dev manquante. Ces dependances n'apparaissent nulle part dans le
# package.json : seule cette table permet de les prevoir.

[deps]
"sharp" = ["libvips-dev"]
"canvas" = ["libcairo2-dev", "libpango1.0-dev", "libjpeg-dev", "libgif-dev", "librsvg2-dev"]
"node-gyp" = ["build-essential", "python3"]
"bcrypt" = ["build-essential", "python3"]
"sqlite3" = ["libsqlite3-dev", "build-essential"]
"better-sqlite3" = ["build-essential", "python3"]
"pg-native" = ["libpq-dev"]
"mysql2" = []
"grpc" = ["build-essential"]
"puppeteer" = ["chromium", "fonts-liberation"]
"playwright" = ["chromium"]
"ldapjs" = ["libldap2-dev", "libsasl2-dev"]
"sodium-native" = ["build-essential"]
"zeromq" = ["build-essential", "libzmq3-dev"]
"usb" = ["libudev-dev"]
"serialport" = ["build-essential", "libudev-dev"]

# Modules Python qui compilent du code natif au `pip install`, quand aucune
# roue precompilee ne convient. granary s'arretait sur « Failed to build
# secp256k1 ». Les noms sont ceux de PyPI, en minuscules.
[pip]
"secp256k1" = ["build-essential", "pkg-config", "autoconf", "automake", "libtool", "libsecp256k1-dev"]
"psycopg2" = ["build-essential", "libpq-dev"]
"mysqlclient" = ["build-essential", "pkg-config", "default-libmysqlclient-dev"]
"lxml" = ["build-essential", "libxml2-dev", "libxslt1-dev"]
"pillow" = ["build-essential", "libjpeg-dev", "zlib1g-dev"]
"cryptography" = ["build-essential", "libssl-dev", "libffi-dev"]
"cffi" = ["build-essential", "libffi-dev"]
"python-ldap" = ["build-essential", "libldap2-dev", "libsasl2-dev"]
"pyldap" = ["build-essential", "libldap2-dev", "libsasl2-dev"]
"cairocffi" = ["libcairo2-dev"]
"pycairo" = ["build-essential", "pkg-config", "libcairo2-dev"]
"pygobject" = ["build-essential", "pkg-config", "libgirepository1.0-dev", "libcairo2-dev"]
"python-magic" = ["libmagic1"]
"pyyaml" = ["libyaml-dev"]
"uwsgi" = ["build-essential", "libpcre3-dev"]
"gevent" = ["build-essential"]
"numpy" = ["build-essential"]
"pycurl" = ["build-essential", "libcurl4-openssl-dev", "libssl-dev"]
"xmlsec" = ["build-essential", "pkg-config", "libxmlsec1-dev"]
"python-pam" = ["libpam0g-dev"]
"pyzmq" = ["build-essential", "libzmq3-dev"]
"argon2-cffi" = ["build-essential", "libffi-dev"]
"bcrypt" = ["build-essential", "libffi-dev"]
"cython" = ["build-essential"]
"av" = ["build-essential", "pkg-config", "libavformat-dev", "libavcodec-dev", "libavdevice-dev", "libavutil-dev", "libswscale-dev", "libavfilter-dev"]

# Les gemmes Ruby a extension native : feedbin echouait sur idn-ruby, faute
# de libidn.
[gem]
"idn-ruby" = ["libidn-dev"]
"pg" = ["libpq-dev"]
"mysql2" = ["default-libmysqlclient-dev"]
"nokogiri" = ["libxml2-dev", "libxslt1-dev"]
"rmagick" = ["libmagickwand-dev"]
"ruby-vips" = ["libvips-dev"]
"charlock_holmes" = ["libicu-dev"]
"sqlite3" = ["libsqlite3-dev"]
"curb" = ["libcurl4-openssl-dev"]
"ffi" = ["libffi-dev"]
"psych" = ["libyaml-dev"]
"idn" = ["libidn-dev"]
"rugged" = ["cmake", "pkg-config", "libssl-dev"]
"gpgme" = ["libgpgme-dev"]
"cld3" = ["libprotobuf-dev", "protobuf-compiler"]
"mini_racer" = ["build-essential"]
"ox" = ["build-essential"]
