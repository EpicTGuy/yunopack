# Correspondance des noms de paquets Alpine vers Debian.
#
# Les Dockerfiles a base Alpine donnent des noms qui n'existent pas en Debian.
# Sans cette table, les dependances d'une application sur deux seraient perdues.
# Une entree absente n'est pas traduite : on prefere signaler l'inconnu.

[packages]
# Outils de compilation
"build-base" = "build-essential"
"alpine-sdk" = "build-essential"
"musl-dev" = ""            # specifique a Alpine, sans objet en Debian
"linux-headers" = "linux-libc-dev"
"g++" = "g++"
"gcc" = "gcc"
"make" = "make"
"cmake" = "cmake"
"pkgconf" = "pkg-config"
"pkgconfig" = "pkg-config"
"autoconf" = "autoconf"
"automake" = "automake"
"libtool" = "libtool"

# Bibliotheques courantes : le suffixe -dev existe dans les deux mondes, mais
# les prefixes different.
"openssl-dev" = "libssl-dev"
"libssl-dev" = "libssl-dev"
"zlib-dev" = "zlib1g-dev"
"libffi-dev" = "libffi-dev"
"libxml2-dev" = "libxml2-dev"
"libxslt-dev" = "libxslt1-dev"
"libjpeg-turbo-dev" = "libjpeg-dev"
"jpeg-dev" = "libjpeg-dev"
"libpng-dev" = "libpng-dev"
"freetype-dev" = "libfreetype-dev"
"vips-dev" = "libvips-dev"
"vips" = "libvips42"
# docuseal charge leptonica par FFI (liblept.so.5).
"leptonica" = "liblept5"
"leptonica-dev" = "libleptonica-dev"
"cairo-dev" = "libcairo2-dev"
"pango-dev" = "libpango1.0-dev"
"giflib-dev" = "libgif-dev"
"librsvg-dev" = "librsvg2-dev"
"icu-dev" = "libicu-dev"
"icu-libs" = "libicu72"
"sqlite-dev" = "libsqlite3-dev"
"sqlite-libs" = "libsqlite3-0"
"postgresql-dev" = "libpq-dev"
"postgresql-client" = "postgresql-client"
"postgresql-libs" = "libpq5"
"mariadb-dev" = "libmariadb-dev"
"mariadb-client" = "mariadb-client"
"mysql-client" = "default-mysql-client"
"libc6-compat" = ""
"libstdc++" = "libstdc++6"
"libgcc" = "libgcc-s1"
"krb5-dev" = "libkrb5-dev"
"cyrus-sasl-dev" = "libsasl2-dev"
"openldap-dev" = "libldap2-dev"
"zstd-dev" = "libzstd-dev"
"brotli-dev" = "libbrotli-dev"
"lz4-dev" = "liblz4-dev"

# Outils
"curl" = "curl"
"wget" = "wget"
"git" = "git"
"bash" = "bash"
"ca-certificates" = "ca-certificates"
"tzdata" = "tzdata"
"tini" = "tini"
"su-exec" = "gosu"
"shadow" = "passwd"
"procps" = "procps"
"findutils" = "findutils"
"coreutils" = "coreutils"
"jq" = "jq"
"unzip" = "unzip"
"xz" = "xz-utils"
"imagemagick" = "imagemagick"
"ffmpeg" = "ffmpeg"
"ghostscript" = "ghostscript"
"poppler-utils" = "poppler-utils"
"tesseract-ocr" = "tesseract-ocr"
"chromium" = "chromium"
"fontconfig" = "fontconfig"
"ttf-freefont" = "fonts-freefont-ttf"
"font-noto" = "fonts-noto"
"graphicsmagick" = "graphicsmagick"
"rsync" = "rsync"
"openssh-client" = "openssh-client"
"gnupg" = "gnupg"
"perl" = "perl"
"python3" = "python3"
"py3-pip" = "python3-pip"
"nodejs" = "nodejs"
"npm" = "npm"
