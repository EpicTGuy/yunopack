# Services sans equivalent provisionnable par YunoHost.
#
# Alimente la regle DB002. `[resources.database]` ne connait que mysql et
# postgresql ; mongodb et redis passent par des helpers. Tout le reste
# demanderait d'empaqueter un service a part entiere.

[services]
blocking = [
  "elasticsearch", "opensearch", "clickhouse", "cassandra", "scylla",
  "typesense", "meilisearch", "solr", "neo4j", "influxdb", "questdb",
  "couchdb", "etcd", "consul", "vault",
  "rabbitmq", "kafka", "zookeeper", "nats", "pulsar",
  "cockroach", "tidb", "vitess",
  "clamav", "gotenberg", "tika",
]

# Services que YunoHost fournit deja ou remplace : leur presence dans un compose
# n'est pas un probleme, ils disparaissent simplement au packaging.
replaced = ["nginx", "traefik", "caddy", "haproxy", "swag", "apache", "httpd"]
