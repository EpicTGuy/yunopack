# Stockage objet S3 embarque par les paquets dont l'application en exige un.
#
# SeaweedFS plutot que Garage : parmi des ecritures conditionnelles
# simultanees (If-Match, If-None-Match) sur un meme objet, SeaweedFS n'en
# laisse reussir qu'une ; Garage v2.2.0 les laisse toutes reussir (mesure le
# 2026-09-30, 32 ecrivains). Une application qui s'en sert comme verrou —
# Buzz pour ses depots git — se corromprait sur Garage.
#
# Empreintes : celles que GitHub publie pour chaque fichier de la release.

