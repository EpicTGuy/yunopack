<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>yunopack</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Cpath fill='%232b6b4f' fill-rule='evenodd' d='M3.5 0H12.5L16 3.5V12.5L12.5 16H3.5L0 12.5V3.5Z M5 5.5L6.8 3.7L11.1 8L6.8 12.3L5 10.5L7.5 8Z'/%3E%3C/svg%3E">
<script>try{var t=localStorage.getItem('yunopack:theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{color-scheme:light dark;--bg:#fbfaf8;--fg:#1c1b19;--mute:#6b6862;--line:#e0ddd6;--panel:#f2f0eb;--acc:#2b6b4f;--acc-fg:#fbfaf8;--acc-bg:#eaf1ec;--err:#a33;--err-bg:#f9eeec;
--mono:ui-monospace,"SF Mono","Cascadia Mono","DejaVu Sans Mono",Menlo,Consolas,monospace;--sans:system-ui,-apple-system,"Segoe UI","Noto Sans","Helvetica Neue",sans-serif}
/* Thème : « auto » suit le système ; « clair » et « sombre » l'imposent (data-theme sur <html>). */
:root[data-theme=light]{color-scheme:light}
:root[data-theme=dark]{color-scheme:dark;--bg:#16171a;--fg:#e8e6e1;--mute:#9a968e;--line:#2c2e33;--panel:#1d1f23;--acc:#6fbf95;--acc-fg:#16171a;--acc-bg:#18251e;--err:#e4756b;--err-bg:#2a1c1b}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#16171a;--fg:#e8e6e1;--mute:#9a968e;--line:#2c2e33;--panel:#1d1f23;--acc:#6fbf95;--acc-fg:#16171a;--acc-bg:#18251e;--err:#e4756b;--err-bg:#2a1c1b}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans)}
a{color:var(--acc);text-underline-offset:2px}a:hover{color:var(--fg)}
code{font-family:var(--mono)}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:0 20px}
header{border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding:22px 0 18px}
.brand{display:flex;align-items:center;gap:10px;color:var(--fg);text-decoration:none}
.brand svg{width:24px;height:24px;color:var(--acc);display:block;flex:none}
.brand b{font:600 17px/1 var(--mono);letter-spacing:-.01em}
.tag{margin-left:auto;color:var(--mute);font:13px var(--mono)}
.bascule{appearance:none;background:none;border:0;padding:0;color:var(--mute);font:12px var(--sans);
  text-decoration:underline;text-underline-offset:2px;cursor:pointer}
.bascule:hover{color:var(--fg)}
.theme{display:flex;gap:2px;margin-left:16px;padding:2px;border:1px solid var(--line);border-radius:6px;flex:none}
.theme button{appearance:none;border:0;background:none;color:var(--mute);font:12px var(--sans);padding:0 9px;height:26px;border-radius:4px;cursor:pointer}
.theme button:hover{color:var(--fg)}
.theme button[aria-pressed=true]{background:var(--panel);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line)}
.theme button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
nav{display:flex;gap:28px;overflow-x:auto;scrollbar-width:none}
nav button{appearance:none;background:none;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;padding:8px 0 10px;font:14px var(--sans);color:var(--mute);cursor:pointer;white-space:nowrap}
nav button:hover{color:var(--fg)}
nav button[aria-selected=true]{color:var(--fg);border-color:var(--acc)}
nav .n{font:12px var(--mono);color:var(--mute);margin-left:6px}
main.wrap{padding-top:40px;padding-bottom:72px}
h1{font-size:20px;line-height:1.3;margin:0}
#tab-run > h1{margin-bottom:20px}
.lead{color:var(--mute);margin:4px 0 20px;max-width:62ch;text-wrap:pretty}
.lbl{display:block;font:12px var(--mono);color:var(--mute);margin:0 0 6px}
.row{display:flex;gap:8px}
input,select{flex:1;width:100%;min-width:0;height:44px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:14px var(--mono)}
input::placeholder{color:var(--mute)}
input:focus,select:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:transparent}
.btn{appearance:none;height:44px;padding:0 18px;border-radius:6px;border:1px solid var(--acc);background:var(--acc);color:var(--acc-fg);font:600 14px var(--sans);cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
.btn:hover{filter:brightness(1.08);color:var(--acc-fg)}
.btn:disabled{opacity:.5;cursor:default;filter:none}
.btn.ghost{background:transparent;color:var(--acc)}
.btn.ghost:hover{background:var(--acc-bg);filter:none}
.btn.sm{height:34px;padding:0 12px;font-size:13px}
.btn.plain{border-color:var(--line);background:transparent;color:var(--fg)}
.hint{margin:8px 0 0;color:var(--mute);font-size:13px}
.hint.err{color:var(--err)}
.pipe{margin-top:32px}
.pipe-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font:13px var(--mono);color:var(--mute);margin-bottom:8px}
.pipe-h strong{color:var(--fg);font-weight:600}
#pipe-t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.pipe-h.ok strong{color:var(--acc)}.pipe-h.fail strong{color:var(--err)}
.rail{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-bottom:24px}
.rail i{height:4px;border-radius:2px;background:var(--line)}
.rail i[data-s=ok]{background:var(--acc)}
.rail i[data-s=running]{background:var(--acc);animation:pulse 1.2s ease-in-out infinite}
.rail i[data-s=waiting]{background:var(--acc);opacity:.45}
.rail i[data-s=fail]{background:var(--err)}
@keyframes pulse{50%{opacity:.3}}
@keyframes spin{to{transform:rotate(360deg)}}
ol.steps{list-style:none;margin:0;padding:0}
.step{position:relative;display:grid;grid-template-columns:24px minmax(0,1fr);gap:0 14px;padding-bottom:22px}
.step:last-child{padding-bottom:0}
.step:not(:last-child)::before{content:"";position:absolute;left:11.5px;top:30px;bottom:6px;width:1px;background:var(--line)}
.step[data-s=ok]:not(:last-child)::before{background:var(--acc)}
.mk{position:relative;width:24px;height:24px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font:600 11px/1 var(--mono);color:var(--mute);background:var(--bg)}
.step[data-s=running] .mk{color:var(--acc);border-color:transparent}
.step[data-s=running] .mk::after{content:"";position:absolute;inset:-1.5px;border-radius:50%;border:1.5px solid var(--line);border-top-color:var(--acc);animation:spin .9s linear infinite}
.step[data-s=ok] .mk{background:var(--acc);border-color:var(--acc);color:var(--acc-fg)}
.step[data-s=waiting] .mk{border-color:var(--acc);color:var(--acc)}
.step[data-s=fail] .mk{background:var(--err);border-color:var(--err);color:var(--bg)}
.step[data-s=skipped] .mk{border-style:dashed}
.hd{display:flex;align-items:baseline;gap:10px;min-height:24px;flex-wrap:wrap;cursor:pointer;border-radius:4px}
.hd:hover .nm{text-decoration:underline;text-underline-offset:3px;text-decoration-style:dotted}
.hd:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.expl{margin:6px 0 2px;padding:10px 12px;background:var(--panel);border-radius:6px}
.expl ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.expl li{font-size:13px;line-height:1.55;color:var(--fg);text-wrap:pretty}
.nm{font-weight:600}
.step[data-s=pending] .nm,.step[data-s=skipped] .nm{color:var(--mute);font-weight:500}
.sub{color:var(--mute);font-size:13px}
.st{margin-left:auto;font:12px var(--mono);color:var(--mute);white-space:nowrap}
.step[data-s=running] .st,.step[data-s=ok] .st,.step[data-s=waiting] .st{color:var(--acc)}
.step[data-s=fail] .st{color:var(--err)}
.sum{font:13px/1.5 var(--mono);margin-top:2px;overflow-wrap:anywhere}
.sum:empty{display:none}
.step[data-s=ok] .sum.final{font-weight:600}
.log{margin-top:6px}
.log summary{cursor:pointer;font:12px var(--mono);color:var(--mute);list-style:none;display:inline-flex;gap:6px;user-select:none}
.log summary::-webkit-details-marker{display:none}
.log summary::before{content:"▸"}
.log[open] summary::before{content:"▾"}
.log summary:hover{color:var(--fg)}
.log ol{list-style:none;margin:6px 0 0;padding:8px 12px;background:var(--panel);border-radius:6px;font:12px/1.65 var(--mono)}
.log li{display:grid;grid-template-columns:44px minmax(0,1fr);gap:8px;overflow-wrap:anywhere}
.log time{color:var(--mute)}
.why{margin-top:10px;border:1px solid var(--err);border-radius:6px;background:var(--err-bg);padding:12px 14px}
.why-t{margin:0 0 8px;font-weight:600;color:var(--err)}
.why ul{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.why li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:baseline;font-size:14px}
.code{font:600 12px/1.6 var(--mono);padding:0 6px;border-radius:4px;background:var(--bg);border:1px solid var(--line);color:var(--fg);white-space:nowrap}
.why .note{margin:10px 0 0;color:var(--mute);font-size:13px;text-wrap:pretty}

/* Arbitrages : ce que le depot ne dit pas, et qu'on demande plutot que d'inventer. */
.ask{margin-top:12px;border:1px solid var(--acc);border-radius:6px;background:var(--acc-bg);padding:14px 16px}
.ask-t{margin:0 0 4px;font-weight:600;color:var(--acc)}
.ask-i{margin:0 0 16px;color:var(--mute);font-size:13px;text-wrap:pretty}
.fld{margin-bottom:18px}
.fld:last-of-type{margin-bottom:14px}
.fld > .k{font:600 13px var(--mono);display:block;margin-bottom:2px}
.fld .why-not{margin:0 0 2px;color:var(--mute);font-size:13px;text-wrap:pretty}
.fld .look{margin:0 0 8px;color:var(--mute);font-size:12px;font-style:italic}
.opts{display:grid;gap:4px;margin-bottom:8px}
.opt{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:8px 10px;border:1px solid var(--line);border-radius:5px;background:var(--bg);cursor:pointer}
.opt:hover{border-color:var(--acc)}
.opt:has(input:checked){border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.opt input{flex:none;width:auto;height:auto;margin:5px 0 0;padding:0;min-width:0}
.opt .v{display:block;font:13px/1.5 var(--mono);overflow-wrap:anywhere;white-space:pre-wrap}
.opt .w{display:block;color:var(--mute);font-size:12px;margin-top:1px}
.fld .free{height:38px;font-size:13px}
.pistes{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px}
.pistes .look{margin:0}
.lien-f{height:26px;padding:0 9px;font:12px var(--mono);font-weight:400}
.out{margin-top:28px;border:1px solid var(--acc);border-radius:8px;padding:18px;background:var(--acc-bg)}
.out h2{margin:0;font-size:17px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.out h2 code{font-size:15px;color:var(--acc)}
.out .meta{font:13px var(--mono);color:var(--mute);margin:4px 0 14px}
.cmd{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:6px 6px 6px 12px;font:13px var(--mono)}
.cmd code{flex:1;min-width:0;overflow-x:auto;white-space:nowrap;padding:4px 0}
.cmd code::before{content:"$ ";color:var(--mute)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.apres{margin-top:22px;border-top:1px solid var(--line);padding-top:20px}
.apres .note{margin:0;color:var(--mute);font-size:13px;text-wrap:pretty}
.publie{margin:0 0 12px;font:13px var(--mono);overflow-wrap:anywhere}
.publie a{overflow-wrap:anywhere}
.stop{margin-top:32px;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:22px;font:13px var(--mono);color:var(--mute)}
.lh{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.lh .c{font:13px var(--mono);color:var(--mute);white-space:nowrap}
ul.items{list-style:none;margin:24px 0 0;padding:0;border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:32px minmax(0,1fr) auto auto;gap:4px 14px;padding:22px 0;border-bottom:1px solid var(--line);align-items:center}
.item .ico{width:32px;height:32px;border-radius:6px;object-fit:cover;background:var(--panel);grid-row:span 1}
.item .ico[hidden]{display:block!important;visibility:hidden}
.item .ds{color:var(--mute);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:1px}
.item .mt{display:flex;flex-wrap:wrap;gap:4px 12px;font:12px var(--mono);color:var(--mute);margin-top:4px;min-width:0}
.item .mt a{color:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.item .mt a:hover{color:var(--fg)}
/* Badge de faisabilite : le meme verdict que celui du pipeline, pas une
   estimation faite a part qui pourrait en diverger. */
.fais{appearance:none;border:1px solid var(--line);border-radius:999px;background:transparent;
      font:600 12px var(--mono);color:var(--mute);padding:3px 10px;white-space:nowrap;cursor:default;min-width:56px;text-align:center;min-height:24px}
.fais[data-v=feasible]{color:var(--acc);border-color:var(--acc);background:var(--acc-bg)}
.fais[data-v=work]{color:#8a6d1f;border-color:#c9a227;background:#fbf4e0}
:root[data-theme=dark] .fais[data-v=work]{color:#e3c05c;border-color:#7a6220;background:#2a2313}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .fais[data-v=work]{color:#e3c05c;border-color:#7a6220;background:#2a2313}}
.fais[data-v=no]{color:var(--err);border-color:var(--err);background:var(--err-bg)}
.fais[data-v=pending]{font-style:italic;font-weight:400}
.fais.cliquable{cursor:pointer}
.fais.cliquable:hover{border-color:var(--fg);color:var(--fg)}
.pourquoi{grid-column:2/-1;margin:8px 0 0;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font-size:13px}
.pourquoi ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.pourquoi li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:baseline}
.pourquoi .rm{color:var(--mute);font-size:12px;display:block;margin-top:2px}
.gouv{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.gouv-t{font:12px var(--mono);color:var(--mute);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}
.gouv ul{list-style:none;margin:0;padding:0;display:grid;gap:4px}
.gouv li{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:10px;align-items:baseline;font-size:13px}
.gouv .q{font-weight:600;overflow-wrap:anywhere}
.gouv .p{color:var(--mute);font-size:12px}
.notes{display:grid;gap:5px;margin-top:6px}
.critere{display:grid;grid-template-columns:minmax(0,10rem) 1fr auto;gap:10px;align-items:center;font-size:13px}
.critere .n{overflow-wrap:anywhere}
.critere .v{font:12px var(--mono);color:var(--mute)}
.jauge{height:5px;border-radius:3px;background:var(--line);overflow:hidden}
.jauge i{display:block;height:100%;background:var(--acc)}
.jauge[data-n=moyen] i{background:#c9a227}
.jauge[data-n=faible] i{background:var(--err)}
.puce{color:var(--mute)}
.tech{margin-left:8px;font:11px var(--mono);color:var(--mute);font-weight:400}
@media (max-width:520px){.critere{grid-template-columns:minmax(0,1fr) auto}.critere .jauge{grid-column:1/-1}}
@media (max-width:520px){.gouv li{grid-template-columns:minmax(0,1fr)}}
.audit{grid-column:2/-1;margin:8px 0 0;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
.audit ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:10px}
.audit li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:baseline;font-size:13px}
.audit .rm{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.audit-m{display:flex;flex-wrap:wrap;gap:6px;margin-top:5px}
.audit-ok{margin:0;color:var(--acc);font-size:13px}
.audit-note{margin:4px 0 0;color:var(--mute);font-size:12px;text-wrap:pretty}
.pourquoi .quand{color:var(--mute);font-size:12px;margin:10px 0 0;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.lic{border:1px solid var(--line);border-radius:4px;padding:0 5px}
.votes{margin-left:8px;font:12px var(--mono);color:var(--acc);font-weight:400}
.niv{margin-left:8px;font:11px var(--mono);font-weight:400;border:1px solid currentColor;border-radius:4px;padding:0 5px;white-space:nowrap}
.niv[data-e=bon]{color:var(--acc)}
.niv[data-e=moyen]{color:#8a6d1f}
.niv[data-e=faible]{color:var(--err)}
.niv[data-e=inconnu]{color:var(--mute)}
:root[data-theme=dark] .niv[data-e=moyen]{color:#e3c05c}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .niv[data-e=moyen]{color:#e3c05c}}
.item .mt .lien{height:28px;width:32px;padding:0;justify-content:center}
.ic{width:16px;height:16px;display:block;flex:none}
.etiq{border-radius:4px;padding:0 6px;border:1px solid currentColor;font-size:11px;white-space:nowrap}
.etiq.pack{color:var(--acc)}
.etiq.mort{color:var(--err)}
.etiq.nonlibre{color:#8a6d1f}
:root[data-theme=dark] .etiq.nonlibre{color:#e3c05c}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .etiq.nonlibre{color:#e3c05c}}
.suggest{position:relative}
.liste-sug{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);max-height:16rem;overflow-y:auto;
  background:var(--carte,var(--bg));border:1px solid var(--line);border-radius:6px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:4px}
.liste-sug button{display:block;width:100%;text-align:left;appearance:none;border:0;background:none;color:var(--fg);
  font:14px var(--sans);padding:6px 10px;border-radius:4px;cursor:pointer}
.liste-sug button:hover,.liste-sug button[aria-selected=true]{background:var(--acc-bg);color:var(--fg)}

.empty{color:var(--mute);padding:18px 0;font-size:14px}
.more{margin-top:16px}
@media (max-width:520px){.wrap{padding:0 16px}.tag,.sub{display:none}nav{gap:12px}nav button > .ic{display:none}.theme{margin-left:auto}.item{grid-template-columns:minmax(0,1fr)}.item .btn{justify-self:start;margin-top:6px}.btn.go{padding:0 14px}}
/* ——— Icônes et lecture visuelle ——— */
nav button{display:inline-flex;align-items:center;gap:7px}
nav button > .ic{width:15px;height:15px}
nav button[aria-selected=true] > .ic{color:var(--acc)}
.btn .ic{width:16px;height:16px}
.btn.sm .ic{width:14px;height:14px}
.btn.icone-seule{width:34px;padding:0;justify-content:center}
.promesses{list-style:none;margin:12px 0 28px;padding:0;display:flex;flex-wrap:wrap;gap:8px}
.promesses li{display:inline-flex;align-items:center;gap:7px;padding:5px 12px 5px 9px;border:1px solid var(--line);border-radius:999px;font-size:13px}
.promesses .ic{color:var(--acc);width:15px;height:15px}
.champ-ic{position:relative;flex:1;min-width:0;display:flex}
.champ-ic > .ic{position:absolute;left:13px;top:50%;margin-top:-8px;color:var(--mute);pointer-events:none}
.champ-ic > input{padding-left:40px}
.etapes{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));margin:4px 0 0}
.et{position:relative;appearance:none;background:none;border:0;padding:0;margin:0;color:inherit;font:inherit;display:flex;flex-direction:column;align-items:center;gap:10px;cursor:pointer;text-align:center;min-width:0}
.et::before{content:"";position:absolute;top:23px;left:calc(-50% + 30px);right:calc(50% + 30px);height:2px;border-radius:1px;background:var(--line)}
.et:first-child::before{display:none}
.et:not([data-s=pending]):not([data-s=skipped])::before{background:var(--acc)}
.pas{position:relative;width:48px;height:48px;border-radius:14px;display:grid;place-items:center;border:1.5px solid var(--line);background:var(--bg);color:var(--mute);transition:background .2s,border-color .2s,color .2s}
.pas > .ic{width:22px;height:22px}
.et:hover .pas,.et[aria-expanded=true] .pas{border-color:var(--acc);color:var(--acc)}
.et:focus-visible{outline:none}.et:focus-visible .pas{outline:2px solid var(--acc);outline-offset:3px}
.et[data-s=running] .pas,.et[data-s=waiting] .pas{border-color:var(--acc);color:var(--acc);background:var(--acc-bg)}
.et[data-s=running] .pas::after{content:"";position:absolute;inset:-6px;border-radius:18px;border:2px solid var(--acc);animation:pulse 1.2s ease-in-out infinite}
.et[data-s=ok] .pas{background:var(--acc);border-color:var(--acc);color:var(--acc-fg)}
.et[data-s=fail] .pas{background:var(--err);border-color:var(--err);color:var(--bg)}
.et[data-s=skipped] .pas{border-style:dashed}
.pastille{position:absolute;right:-7px;bottom:-7px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--bg);color:var(--acc);border:1.5px solid currentColor}
.pastille:empty{display:none}
.pastille .ic{width:11px;height:11px}
.pastille .ic path{stroke-width:3}
.et[data-s=fail] .pastille{color:var(--err)}
.et .l{font-size:12px;font-weight:600;line-height:1.3;color:var(--fg);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.et[data-s=pending] .l,.et[data-s=skipped] .l{color:var(--mute);font-weight:500}
.expl-et{margin:22px 0 0;padding:14px 16px;border-radius:8px;background:var(--panel)}
.expl-h{display:flex;align-items:center;gap:8px;margin:0 0 10px;flex-wrap:wrap}
.expl-h .ic{color:var(--acc)}
.expl-h .sub{color:var(--mute);font-size:13px}
.expl-et ul{list-style:none;margin:0;padding:0;display:grid;gap:7px}
.expl-et li{font-size:13px;line-height:1.55;text-wrap:pretty}
.statut{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:26px 0 24px;padding:10px 14px;border-radius:8px;background:var(--panel);font:13px var(--mono);color:var(--mute)}
#pipe-t{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;white-space:nowrap}
#pipe-t strong{color:var(--fg);font-weight:600}
#pipe-t > .ic{color:var(--acc)}
.statut.ok #pipe-t strong{color:var(--acc)}
.statut.fail #pipe-t strong,.statut.fail #pipe-t > .ic{color:var(--err)}
.spin{width:14px;height:14px;flex:none;border-radius:50%;border:2px solid var(--line);border-top-color:var(--acc);animation:spin .9s linear infinite}
.horloge{display:inline-flex;align-items:center;gap:6px;flex:none}
.horloge .ic{width:14px;height:14px}
.mk .ic{width:13px;height:13px}
.step[data-s=ok] .mk .ic path,.step[data-s=fail] .mk .ic path{stroke-width:2.6}
.hd .i{display:inline-flex;align-self:center;color:var(--mute)}
.hd .i .ic{width:14px;height:14px}
.hd:hover .i{color:var(--acc)}
.sum{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.chip{display:inline-flex;align-items:center;gap:6px;font:12px/1.5 var(--mono);padding:2px 9px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.chip .ic{width:13px;height:13px;color:var(--mute)}
.verdict{display:inline-flex;align-items:center;gap:6px;font:600 12px/1.5 var(--mono);padding:2px 10px 2px 8px;border-radius:999px;border:1px solid var(--acc);color:var(--acc);background:var(--acc-bg)}
.verdict .ic{width:13px;height:13px}
.verdict[data-v=work]{color:#8a6d1f;border-color:#c9a227;background:#fbf4e0}
:root[data-theme=dark] .verdict[data-v=work]{color:#e3c05c;border-color:#7a6220;background:#2a2313}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .verdict[data-v=work]{color:#e3c05c;border-color:#7a6220;background:#2a2313}}
.verdict[data-v=no]{color:var(--err);border-color:var(--err);background:var(--err-bg)}
.score{display:inline-flex;align-items:center;gap:8px;font:12px var(--mono);color:var(--mute)}
.score .jauge{width:96px}
.score b{color:var(--fg)}
.log summary{align-items:center}
.log summary .ic{width:13px;height:13px}
.why-t{display:flex;align-items:center;gap:8px}
.why li,.pourquoi li,.audit li{align-items:start}
.why li > .ic{color:var(--err);margin-top:3px}
.pourquoi li > .ic,.audit li > .ic{margin-top:2px}
.m-croix > .ic{color:var(--err)}
.m-alerte > .ic{color:#c9a227}
.m-info > .ic{color:var(--mute)}
.ask-t{display:flex;align-items:center;gap:8px}
.out{display:grid;grid-template-columns:56px minmax(0,1fr);gap:16px;align-items:center;padding:20px}
.boite{width:56px;height:56px;border-radius:14px;display:grid;place-items:center;background:var(--acc);color:var(--acc-fg)}
.boite .ic{width:28px;height:28px}
.out-t{min-width:0}
.stats{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.out > .cmd,.out > .acts,.out > .apres{grid-column:1/-1;margin-top:0}
.apres-l{display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;font-size:13px;color:var(--mute)}
.apres-l > span:first-of-type{flex:1;min-width:180px;text-wrap:pretty}
.apres-a{display:flex;gap:6px;flex-wrap:wrap}
.fais{display:inline-flex;align-items:center;justify-content:center;gap:5px}
.fais .ic{width:12px;height:12px}
.item .mt .m{display:inline-flex;align-items:center;gap:4px}
.item .mt .m .ic{width:13px;height:13px}
.votes{display:inline-flex;align-items:center;gap:4px}
.votes .ic{width:12px;height:12px}
.etiq{display:inline-flex;align-items:center;gap:4px}
.etiq .ic{width:11px;height:11px}
.gouv ul{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.gouv li{grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg)}
.gouv li > .ic{color:var(--acc);margin-top:2px}
.gouv .q,.gouv .p{display:block}
@media (max-width:520px){.et .l{display:none}.pas{width:44px;height:44px}.et::before{top:21px;left:calc(-50% + 26px);right:calc(50% + 26px)}
  .out{grid-template-columns:44px minmax(0,1fr)}.boite{width:44px;height:44px;border-radius:12px}.boite .ic{width:22px;height:22px}}
/* Un seul format d'encart : même bord, même fond, même rayon, même marge
   intérieure. Le ton (erreur, décision, succès) ne passe que par le titre. */
.why,.ask,.out,.expl,.expl-et,.statut,.pourquoi,.audit,.log ol{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:14px 16px;box-shadow:none}
.statut{padding:10px 16px}
.why,.ask,.expl,.pourquoi,.audit{margin-top:12px}
.out{padding:16px}
/* Colonnes fixes pour le badge et l'action : chaque ligne est sa propre
   grille, des colonnes « auto » décalaient donc tout d'une ligne à l'autre. */
.item{grid-template-columns:32px minmax(0,1fr) 104px 164px}
.item > .fais{width:100%;justify-self:stretch}
.item > .btn{width:100%;justify-content:center;justify-self:stretch}
@media (max-width:520px){.item{grid-template-columns:minmax(0,1fr)}.item > .fais,.item > .btn{width:auto;justify-self:start}}
/* Rien à signaler : ni liste vide, ni trait de séparation au-dessus de rien. */
.pourquoi > ul:empty{display:none}
.pourquoi > ul:empty + .gouv{border-top:0;margin-top:0;padding-top:0}
/* Mobile : plus compact, sans tasser. */
@media (max-width:520px){
  .top{padding:14px 0 10px}
  nav{gap:20px}
  main.wrap{padding-top:24px;padding-bottom:40px}
  #tab-run > h1{margin-bottom:14px}
  .lead{margin:2px 0 14px;font-size:14px}
  .pipe{margin-top:22px}
  .statut{margin:18px 0 16px}
  .step{padding-bottom:16px}
  .expl-et{margin-top:16px}
  ul.items{margin-top:16px}
  .item{padding:14px 0;gap:4px 12px}
  .item > .fais,.item > .btn{margin-top:4px}
  .why,.ask,.out,.expl,.expl-et,.pourquoi,.audit{padding:12px 14px}
  .out{gap:12px}
  .gouv ul{grid-template-columns:minmax(0,1fr)}
  .apres{padding-top:14px}
  .stop{margin-top:20px;padding-top:14px}
}
/* Mobile : le bloc de texte se dissout dans la grille de la ligne, ce qui
   place les liens, le score et l'action sur une même rangée. Les liens
   occupent la colonne souple et passent à la ligne au besoin : rien ne se
   chevauche, quelle que soit la largeur des boutons. */
@media (max-width:520px){
  .item{grid-template-columns:32px minmax(0,1fr) auto auto;
    grid-template-areas:"ico nm nm nm" "ico ds ds ds" "ico mt mt mt" "ico lk fa bt";align-items:center;row-gap:0}
  .item > .ico{grid-area:ico;align-self:start}
  .item > div:not(.pourquoi):not(.audit){display:contents}
  .item > div > .nm{grid-area:nm}
  .item > div > .ds{grid-area:ds}
  .item > div > .mt:not(:last-child){grid-area:mt}
  .item > div > .mt:last-child{grid-area:lk;margin-top:8px}
  .item > .fais,.item > span:empty:not(.ico){grid-area:fa;justify-self:end;margin-top:8px}
  .item > .btn{grid-area:bt;justify-self:end;margin-top:8px}
  .item > .pourquoi,.item > .audit{grid-column:1/-1;grid-row:5}
  .item > .fais{min-width:0}
}
/* Encarts intérieurs (propositions, commande, traits du projet, critères) :
   un seul format, posé sur le fond de l'encart parent. */
.opt,.cmd,.gouv li,.notes .critere{border:1px solid var(--line);border-radius:6px;background:var(--bg);padding:8px 12px;box-shadow:none}
.opt:has(input:checked){border-color:var(--acc);box-shadow:none;outline:1px solid var(--acc);outline-offset:-2px}
.cmd{padding:6px 6px 6px 12px}
.notes{gap:6px}
.opts,.gouv ul,.notes{gap:6px}
.fld .free,.ask select{border-radius:6px;background:var(--bg)}
/* Étiquettes : même hauteur, même rayon, même police. */
.lic,.etiq,.niv,.code{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:4px;font:500 11px/1 var(--mono);border:1px solid currentColor;white-space:nowrap}
.lic,.code{border-color:var(--line);color:var(--fg);background:var(--bg)}
.niv{margin-left:8px}
/* Mobile, réglage fin : sous l'icône, les rangées de méta et de liens
   repartent du bord gauche au lieu de laisser une marge vide ; les liens
   tiennent ainsi sur une ligne avec le score et l'action. */
@media (max-width:520px){
  .item{grid-template-columns:28px minmax(0,1fr) auto auto;column-gap:10px;
    grid-template-areas:"ico nm nm nm" "ico ds ds ds" "mt mt mt mt" "lk lk fa bt"}
  .item > .ico{width:28px;height:28px}
  .item .mt{gap:4px 8px}
  .item .mt .lien{width:30px;height:30px}
  .item > div > .mt:not(:last-child){margin-top:6px}
  .item > .btn{padding:0 10px}
}
/* Mobile, alignement : une seule marge gauche pour tout le bloc. L'icône
   devient une vignette posée devant le nom, comme un titre. */
@media (max-width:520px){
  .item{grid-template-columns:22px minmax(0,1fr) auto auto;column-gap:10px;padding:16px 0;
    grid-template-areas:"ico nm nm nm" "ds ds ds ds" "mt mt mt mt" "lk lk fa bt"}
  .item > .ico{width:22px;height:22px;border-radius:5px;align-self:center}
  .item > div > .nm{align-self:center}
  .item > div > .ds{margin-top:6px}
  .item > div > .mt:not(:last-child){margin-top:8px}
  .item > div > .mt:last-child,.item > .fais,.item > span:empty:not(.ico),.item > .btn{margin-top:12px}
  #alt-form .row{flex-wrap:wrap}
  #alt-form .champ-ic{flex:1 1 100%}
  #alt-form .row > .btn{flex:1;justify-content:center}
  #alt-form .liste-sug{top:48px}
}
/* Noms de fichiers : jamais coupés au milieu (« CONTRIBUTING.m / d »).
   Chacun est une étiquette insécable ; trop long pour la ligne, il passe
   entier à la suivante, et s'abrège en « … » seulement s'il dépasse la
   largeur disponible — le nom complet reste au survol. */
.nomf{display:inline-block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle;
  height:20px;line-height:18px;padding:0 7px;border:1px solid var(--line);border-radius:4px;background:var(--bg);color:var(--fg);font:500 11px/18px var(--mono)}
.q.fichiers{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:3px}
.lien-f{max-width:100%;min-width:0}
.lien-f .nomf{border:0;background:none;padding:0;height:auto;color:inherit;font:inherit;line-height:inherit}
.pistes > .nomf{height:26px;line-height:24px}
.gouv .q,.gouv .p,.item .ds,.pourquoi .rm,.audit .rm,.why li,.opt .w{text-wrap:pretty}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>

<body>
<header>
  <div class="wrap">
    <div class="top">
      <a class="brand" href="#" data-tab="run" aria-label="yunopack — accueil">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M5 0H19L24 5V19L19 24H5L0 19V5Z M5.5 8.2L7.5 6.2L13.3 12L7.5 17.8L5.5 15.8L9.3 12Z M14 15.4H19V18.2H14Z"/></svg>
        <b>yunopack</b>

      <span class="tag" data-t="tag"></span>
      <div class="theme" id="theme" role="group">
        <button type="button" data-v="auto" data-t="th_auto"></button>
        <button type="button" data-v="light" data-t="th_clair"></button>
        <button type="button" data-v="dark" data-t="th_sombre"></button>
      </div>
    </div>
    <nav role="tablist" aria-label="Sections">

      <button role="tab" id="tab-b-wish" data-tab="wish" aria-selected="false" aria-controls="tab-wish" data-i="coeur"><span data-t="ong_wish"></span><span class="n" id="wish-n"></span></button>
      <button role="tab" id="tab-b-alt" data-tab="alt" aria-selected="false" aria-controls="tab-alt" data-t="ong_alt" data-i="boussole"></button>
    </nav>
  </div>
</header>

<main class="wrap">
  <section id="tab-run" role="tabpanel" aria-labelledby="tab-b-run">
    <h1 data-t="run_t"></h1>

    <form id="form" novalidate>
      <label class="lbl" for="url" data-t="run_lbl"></label>
      <div class="row suggest">

               role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="url-sug"

  <section id="tab-wish" role="tabpanel" aria-labelledby="tab-b-wish" hidden>

    <p class="lead"><span data-t="wish_lead"></span>
      <a href="https://apps.yunohost.org/wishlist" target="_blank" rel="noopener noreferrer" data-t="wish_voter"></a>.</p>

      </div>
    </form>
    <ul class="items" id="alt-list" hidden></ul>
  </section>
</main>

<script>
(() => {
'use strict';

/* L'application peut etre servie sous un sous-chemin (/yunopack/ par exemple).
   La racine se deduit de l'adresse courante : une URL absolue casserait des
   que l'installateur choisit un autre chemin. */
const RACINE = location.pathname.endsWith('/') ? location.pathname : location.pathname + '/';
const API = {
  jobs: RACINE + 'jobs',
  job: id => `${RACINE}jobs/${id}`,
  events: id => `${RACINE}jobs/${id}/events`,
  reponses: id => `${RACINE}jobs/${id}/reponses`,
  paquet: id => `${RACINE}jobs/${id}/paquet.tar.gz`,
  publier: id => `${RACINE}jobs/${id}/publier`,
  forge: RACINE + 'forge',
  wishlist: RACINE + 'wishlist',
  alternatives: q => RACINE + 'alternatives?q=' + encodeURIComponent(q)
};

/* ——— Langues ———
   Trois langues, un seul dictionnaire. La langue vient du reglage du serveur ;
   `auto` suit celle du navigateur. Ce qui n'est pas traduit retombe sur le
   français plutôt que d'afficher une clé. */
const LANGUES = {
  fr: {
    repere_depot: 'repéré dans le dépôt', autres_langages: 'autres langages',
    tag: 'dépôt git → paquet YunoHost',
    ong_run: 'Empaqueter', ong_wish: 'Liste de souhaits', ong_alt: 'Alternatives',
    run_t: 'Empaqueter un dépôt',
    run_lead: "Lit ce que le projet décrit déjà — Dockerfile, compose, fichiers de projet. Ce qu'il ne peut pas déduire, il te le demande.",
    run_lbl: 'adresse du dépôt, ou nom du logiciel',
    run_ph: 'https://github.com/auteur/projet — ou « nextcloud »',
    run_go: 'Empaqueter', run_go_cours: 'En cours…',
    wish_t: 'Liste de souhaits',
    wish_lead: 'Ce que la communauté YunoHost attend, du plus demandé au moins.',
    wish_voter: 'Voter ou proposer une application',
    wish_filtre: 'filtrer', wish_filtre_ph: 'nom ou description',
    alt_t: 'Alternatives', alt_lead: "Les logiciels auto-hébergeables proches d'un autre.",
    alt_lbl: 'logiciel à remplacer', alt_ph: 'Nextcloud, Miniflux, Grafana…',
    alt_go: 'Chercher',
    etapes: '5 étapes', etape: 'étape', attente: 'en attente', en_cours: 'en cours',
    a_toi: 'à toi', fait: 'fait', bloque: 'bloqué', non_faite: 'non faite',
    connexion: 'connexion…', decision_cours: 'une décision te revient',
    conforme: 'paquet conforme', arret: 'arrêt',
    st_analyse: 'Lecture', st_analyse_s: 'ce que contient le projet',
    st_fais: 'Compatibilité', st_fais_s: 'installable sur YunoHost ?',
    st_spec: 'Choix', st_spec_s: 'ce qui reste à décider',
    st_gen: 'Écriture', st_gen_s: 'fabrication du paquet',
    st_verif: 'Contrôles', st_verif_s: 'le paquet est-il correct ?',
    journal: 'journal', ligne: 'ligne', lignes: 'lignes',
    non_faisable: 'Non faisable', echec: 'Échec',
    champs_1: 'champ à trancher', champs_n: 'champs à trancher',
    champs_i: 'Non déductibles du dépôt. Propositions classées par solidité ; tu peux aussi écrire la tienne.',
    continuer: 'Continuer', valeur: 'valeur', valeur_requise: 'une valeur est nécessaire.',
    chercher_dans: 'chercher dans :',
    pret: 'Paquet prêt', fichiers: 'fichiers', en_temps: 'en',
    copier: 'Copier', copie: 'Copié', selectionne: 'Sélectionne',
    telecharger: 'Télécharger le paquet', autre: 'Autre dépôt',
    publier: 'Publier sur ma forge', publication: 'publication…', publie: 'publié',

function icone_(nom, cls) {

  path.setAttribute('d', TRAITS[nom] || '');
  path.setAttribute('fill', 'none');
  path.setAttribute('stroke', 'currentColor');
  path.setAttribute('stroke-width', '1.8');
  path.setAttribute('stroke-linecap', 'round');
  path.setAttribute('stroke-linejoin', 'round');
  svg.append(path);

}

/* Le résumé d'une étape, rendu lisible d'un coup d'œil : un verdict devient
   une pastille et une jauge, une liste « a · b · c » devient des étiquettes.
   Le texte du serveur reste intact, il est seulement découpé. */
function iconePour(p) {
  if (/\d+\s+(fichiers?|files?|archivos?)/i.test(p)) return 'fichiers';
  if (/^(source\b|v?\d+\.\d)/i.test(p)) return 'etiquette';
  if (/^(go|rust|python|node(\.?js)?|php|java|ruby|typescript|javascript|elixir|kotlin|dart|c#|\.net)$/i.test(p)) return 'code';
  return null;
}
function resume(el, msg) {
  el.textContent = '';
  const sc = msg.match(/^(.*?)\s*[—–-]\s*score\s*(\d+)\s*\/\s*100\s*$/i);
  if (sc) {
    const v = /non|not|no\s/i.test(sc[1]) ? 'no' : /travail|work|trabajo/i.test(sc[1]) ? 'work' : 'feasible';
    const n = Math.max(0, Math.min(100, +sc[2]));
    el.append(h('span', {class: 'verdict', 'data-v': v}, icone_({feasible: 'check', work: 'alerte', no: 'croix'}[v]), sc[1].trim()),
      h('span', {class: 'score'},
        h('span', {class: 'jauge', 'data-n': n >= 80 ? 'bon' : n >= 50 ? 'moyen' : 'faible'}, h('i', {style: 'width:' + n + '%'})),
        h('span', {}, h('b', {text: String(n)}), '/100')));
    return;
  }
  const parts = msg.split(/\s+·\s+/).filter(Boolean);
  if (parts.length > 1) {
    el.append(...parts.map(p => { const ic = iconePour(p); return h('span', {class: 'chip', title: p}, ic ? icone_(ic) : null, p); }));
    return;
  }
  if (/^\d+\s+(fichiers?|files?|archivos?)/i.test(msg)) { el.append(h('span', {class: 'chip'}, icone_('fichiers'), msg)); return; }
  el.textContent = msg;
}

function show(t, push) {
  tabs.forEach(x => { $('#tab-' + x).hidden = x !== t; });
  /* Un seul onglet dans le parcours du clavier, les fleches passent aux
     autres : c'est ainsi que se comporte un jeu d'onglets partout ailleurs. */
  document.querySelectorAll('nav [role=tab]').forEach(b => {
    const actif = b.dataset.tab === t;
    b.setAttribute('aria-selected', actif);
    b.tabIndex = actif ? 0 : -1;
  });
  if (t === 'wish') loadWish();
  if (t === 'alt') setTimeout(() => $('#alt-q').focus(), 0);
  /* En dernier : l'adresse n'est qu'un confort de partage, et certains
     contextes d'affichage la refusent. Son echec ne doit rien emporter. */
  if (push) try {
    history.replaceState(null, '', HASH[t] ? '#' + HASH[t] : location.pathname + location.search);
  } catch (e) { /* page imbriquee ou bac a sable : tant pis pour l'adresse */ }
}
document.querySelectorAll('[data-tab]').forEach(b => b.addEventListener('click', e => { e.preventDefault(); show(b.dataset.tab, true); }));
$('nav').addEventListener('keydown', e => {
  const pas = {ArrowRight: 1, ArrowLeft: -1, Home: 'd', End: 'f'}[e.key];
  if (pas === undefined) return;
  e.preventDefault();
  const onglets = [...document.querySelectorAll('nav [role=tab]')];
  const i = onglets.findIndex(o => o.getAttribute('aria-selected') === 'true');
  const j = pas === 'd' ? 0 : pas === 'f' ? onglets.length - 1
          : (i + pas + onglets.length) % onglets.length;
  show(onglets[j].dataset.tab, true);
  onglets[j].focus();
});

function header() {

function renderFailure(i, msg) {

  const body = m.replace(/^\s*(non\s+faisable|paquet\s+non\s+conforme)\s*[—:-]\s*/i, '');
  const items = body.split(/\s*;\s*/).filter(Boolean).map(x => {
    const c = x.match(/^([A-Z][A-Z_]*\d+)\s*:\s*(.+)$/);

/* ——— Arbitrages ——— */
function renderAsk(arbitrages) {
  if (run) run.arbitrages = arbitrages;
  const i = stageIndex('specification');
  setState(i, 'waiting');
  const r = refs[i];
  r.why.textContent = '';

  const form = h('form', {class: 'ask'},
    h('p', {class: 'ask-t'}, icone_('question'), arbitrages.length + ' ' + tr(arbitrages.length > 1 ? 'champs_n' : 'champs_1')),
    h('p', {class: 'ask-i', text: tr('champs_i')}));

  const saisies = {};
  for (const a of arbitrages) form.append(champ(a, saisies));

  const envoyer = h('button', {class: 'btn sm', type: 'submit'}, tr('continuer'), icone_('fleche'));
  const erreur = h('p', {class: 'hint err', hidden: true, role: 'alert'});
  form.append(h('div', {class: 'acts'}, envoyer, lienTechnique()), erreur);

  form.addEventListener('submit', async e => {
    e.preventDefault();
    erreur.hidden = true; envoyer.disabled = true;
    const reponses = {};
    for (const a of arbitrages) {
      const v = saisies[a.champ].value.trim();
      if (!v) { erreur.textContent = libelleChamp(a.champ) + ' : ' + tr('valeur_requise'); erreur.hidden = false; envoyer.disabled = false; return; }
      reponses[a.champ] = v;
    }
    let res;
    try {
      res = await fetch(API.reponses(run.id), {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify(reponses)});
    } catch (err) {
      erreur.textContent = String(err); erreur.hidden = false; envoyer.disabled = false; return;
    }
    if (!res.ok) {
      const c = await res.json().catch(() => ({}));
      erreur.textContent = c.erreur || tr('refuse') + ' (' + res.status + ')';
      erreur.hidden = false; envoyer.disabled = false; return;
    }
    run.waiting = false;
    form.remove();
    setState(i, 'running');
    busy(true); header();
    brancher();
  });

  r.why.append(form);
}

/* Un champ : sa raison, ou chercher, les propositions, la saisie libre.
   La saisie reste ouverte meme quand des propositions existent : aucune liste
   ne couvre tous les cas, et celui qui connait son application ne doit pas
   etre contraint de choisir dans la notre. */
function champ(a, saisies) {
  const d = h('div', {class: 'fld'},
    h('span', {class: 'k'}, libelleChamp(a.champ),
      technique ? h('span', {class: 'tech', text: a.champ}) : null));
  const aide = aideChamp(a.champ);
  if (aide) d.append(h('p', {class: 'why-not', text: aide}));
  if (technique && a.raison) d.append(h('p', {class: 'why-not', text: a.raison}));
  if (technique && a.ou_chercher && a.ou_chercher.length) {
    d.append(h('p', {class: 'look', text: tr('chercher_dans') + ' ' + a.ou_chercher.join(', ')}));
  }
  /* Les fichiers du dépôt où la réponse a des chances de se trouver. Dire
     « regarde la documentation » sans dire où oblige à fouiller soi-même. */
  if (a.pistes && a.pistes.length) {
    d.append(h('div', {class: 'pistes'},
      h('span', {class: 'look', text: tr('ou_regarder')}),
      ...a.pistes.map(p => p.url
        ? h('a', {class: 'btn sm plain lien-f', href: p.url, target: '_blank',
                  rel: 'noopener noreferrer', title: p.chemin}, h('span', {class: 'nomf', text: p.chemin}))
        : h('span', {class: 'nomf', title: p.chemin, text: p.chemin}))));
  }

  /* Liste fermee. Quand l'analyse a tout de meme relevé des indices, ils
     passent en tete avec ce sur quoi ils reposent : une liste alphabetique
     sans indication perdrait le seul travail utile déjà fait. */
  if (a.choix && a.choix.length) {
    const attestes = (a.candidats || []).filter(c => a.choix.includes(c.value));
    const reste = a.choix.filter(c => !attestes.some(x => x.value === c));
    const menu = h('select', {class: 'free'});
    if (attestes.length) {
      menu.append(h('optgroup', {label: tr('repere_depot')},
        attestes.map(c => h('option', {value: c.value, text: c.value + ' — ' + c.why}))));
      menu.append(h('optgroup', {label: tr('autres_langages')},
        reste.map(c => h('option', {value: c, text: c}))));
    } else {
      menu.append(...a.choix.map(c => h('option', {value: c, text: c})));
    }
    saisies[a.champ] = menu;
    d.append(menu);
    return d;
  }

  const libre = h('input', {class: 'free', type: 'text', autocomplete: 'off', spellcheck: 'false', placeholder: tr('valeur')});
  saisies[a.champ] = libre;

  if (a.candidats && a.candidats.length) {
    d.append(h('div', {class: 'opts'}, a.candidats.map((c, i) => h('label', {class: 'opt'},
      h('input', {type: 'radio', name: 'p:' + a.champ, checked: i === 0, onchange: () => { libre.value = c.value; }}),
      h('span', {}, h('span', {class: 'v', text: c.value}), h('span', {class: 'w', text: c.why}))))));
    libre.value = a.candidats[0].value;
  }
  d.append(libre);
  return d;
}

/* ——— Flux d'evenements ——— */
function onEvent(ev) {
  if (!run || run.result || !ev || typeof ev !== 'object') return;
  const etape = String(ev.etape || '');
  const msg = ev.message != null ? String(ev.message) : '';

  if (ev.paquet) run.pkg = String(ev.paquet);

  const cible = RATTACHE[etape] !== undefined ? RATTACHE[etape] : etape;
  const i = cible == null ? -1 : stageIndex(cible);

  if (i >= 0) {
    for (let j = 0; j < i; j++) if (run.state[j] === 'running' || run.state[j] === 'pending') setState(j, 'ok');
    if (run.state[i] === 'pending') setState(i, 'running');
    const r = refs[i];
    if (msg) {
      r.logOl.append(h('li', {}, h('time', {text: fmtRel(Date.now() - run.t0)}), h('span', {text: msg})));
      const n = r.logOl.children.length;
      r.logN.textContent = ' · ' + n + ' ' + (n > 1 ? tr('lignes') : tr('ligne'));
      r.log.hidden = n < 2;
      resume(r.sum, msg);
      r.sum.className = 'sum' + (ev.termine ? ' final' : '');
      const g = msg.match(/(\d+)\s+fichiers?/); if (i === 3 && g) run.files = +g[1];
      const f = msg.match(/^(\d[\d\s]*) fichiers/); if (i === 0 && f) run.lus = f[1];
    }
    if (etape === 'verification' && !ev.termine) { /* l'etape reste en cours */ }
  }

  if (ev.termine) {
    if (ev.succes !== false) { STAGES.forEach((_, j) => { if (run.state[j] !== 'ok') setState(j, 'ok'); }); finish('ok'); }
    else {
      let at = i >= 0 ? i : run.state.findIndex(s => s === 'running');
      if (at < 0) at = 0;
      setState(at, 'fail');
      renderFailure(at, msg);
      finish('fail', at);
    }
  }
  header();
}

function finish(result, at) {
  if (!run || run.result) return;
  run.result = result; run.end = Date.now(); run.failAt = at;
  clearInterval(ticker);
  if (run.close) run.close();
  if (result === 'fail') {
    for (let j = at + 1; j < STAGES.length; j++) setState(j, 'skipped');
    const url = run.url;
    $('#outcome').append(h('div', {class: 'stop'},
      h('span', {text: tr('arrete_a') + ' ' + (at + 1) + '/5.'}),
      h('button', {class: 'btn sm plain', type: 'button', onclick: () => start(url)}, icone_('rejouer'), tr('relancer'))));
  } else renderSuccess();
  header(); busy(false);
}

function pkgName() {
  if (run.pkg) return run.pkg;
  const last = run.url.replace(/\.git$/, '').replace(/\/+$/, '').split(/[\/:]/).pop() || 'app';
  return last.toLowerCase().replace(/[^a-z0-9]+/g, '_') + '_ynh';
}
function renderSuccess() {
  const name = pkgName();
  /* Le chemin sur le serveur s'installe directement : c'est le plus court
     chemin pour qui fait tourner yunopack sur son propre YunoHost. */
  const chemin = (run.chemin || './' + name);
  const cmd = 'sudo yunohost app install ' + chemin;
  const copyBtn = h('button', {class: 'btn sm ghost icone-seule', type: 'button', title: tr('copier'), 'aria-label': tr('copier')}, icone_('copier'));
  copyBtn.addEventListener('click', () => {
    const etat = (ic, t) => { copyBtn.replaceChildren(icone_(ic)); copyBtn.title = t; copyBtn.setAttribute('aria-label', t); };
    (navigator.clipboard ? navigator.clipboard.writeText(cmd) : Promise.reject()).then(
      () => { etat('check', tr('copie')); setTimeout(() => etat('copier', tr('copier')), 1600); },
      () => { copyBtn.title = tr('selectionne'); });
  });
  const stats = [
    run.files ? ['fichiers', run.files + ' ' + tr('fichiers')] : null,
    ['bouclier', tr('conforme')],
    ['horloge', fmtT(run.end - run.t0)]
  ].filter(Boolean);
  $('#outcome').append(h('div', {class: 'out'},
    h('div', {class: 'boite'}, icone_('paquet')),
    h('div', {class: 'out-t'},
      h('h2', {}, tr('pret'), h('code', {text: name})),
      h('div', {class: 'stats'}, stats.map(([ic, t]) => h('span', {class: 'chip'}, icone_(ic), t)))),
    h('div', {class: 'cmd'}, h('code', {text: cmd}), copyBtn),
    h('div', {class: 'acts'},
      h('a', {class: 'btn', href: API.paquet(run.id), download: name + '.tar.gz'}, icone_('telecharger'), tr('telecharger')),
      publierBtn(run.id, name),
      h('button', {class: 'btn plain', type: 'button', onclick: () => { reset(); run = null; header(); const u = $('#url'); u.value = ''; u.focus(); }},
        icone_('plus'), tr('autre'))),
    h('div', {class: 'apres', id: 'apres'})));
  suite(name);
}

/* Publier, puis faire tester ailleurs.

   yunopack ne teste rien sur la machine qui l'héberge : installer un paquet
   non relu demande les droits root et salirait une instance de production. La
   voie propre est de publier, puis de laisser une machine jetable l'installer
   — c'est exactement ce que fait la CI de YunoHost. */
function publierBtn(id, nom) {

    b.title = 'pousser vers ' + f.url + '/' + f.proprietaire;

function busy(b) { const g = $('#go'); g.disabled = b; g.textContent = tr(b ? 'run_go_cours' : 'run_go'); }

/* L'etat du travail fait foi, pas l'evenement : le journal rejoue a la
   reconnexion contient les demandes deja satisfaites, et les rejouer
   ferait reapparaitre un formulaire auquel on vient de repondre. */
async function attendUneDecision() {
  try {
    const t = await (await fetch(API.job(run.id))).json();
    return t.etat === 'en_attente_de_decision';
  } catch { return true; }
}

function brancher() {
  if (run.close) run.close();
  refs.forEach(r => { r.logOl.textContent = ''; r.log.hidden = true; r.logN.textContent = ''; });
  let got = false;
  const es = new EventSource(API.events(run.id));
  run.close = () => es.close();
  es.onmessage = async e => {
    got = true;
    let d; try { d = JSON.parse(e.data); } catch { return; }
    if (d.arbitrages && d.arbitrages.length) {
      if (!await attendUneDecision()) return;
      es.close();
      run.waiting = true;
      renderAsk(d.arbitrages);
      busy(false); header();
      return;
    }
    if (d.termine && d.succes !== false && d.message) run.chemin = d.message.replace(/^paquet pret\s*:\s*/, '');
    onEvent(d);
  };
  es.onerror = () => {
    es.close();
    if (!run || run.result || run.waiting) return;
    let i = run.state.findIndex(s => s === 'running'); if (i < 0) i = run.state.findIndex(s => s === 'pending');
    if (i < 0) return;
    setState(i, 'running');
    onEvent({etape: STAGES[i][0], termine: true, succes: false, message: got ? 'connexion au serveur interrompue' : 'serveur injoignable'});
  };
}

async function start(url) {
  url = String(url || '').trim();
  const hint = $('#form-hint');
  if (!isRepo(url)) { hint.className = 'hint err'; hint.textContent = 'Adresse de dépôt attendue : https://… ou git@…'; $('#url').focus(); return; }
  $('#trouvailles').hidden = true;
  hint.className = 'hint'; hint.textContent = '';
  if (run && run.close) run.close();
  reset();
  run = {url, t0: Date.now(), state: STAGES.map(() => 'pending'), result: null};
  $('#url').value = url;
  busy(true); header();
  ticker = setInterval(header, 500);

  let id;
  try {
    const r = await fetch(API.jobs, {method: 'POST', headers: {'content-type': 'application/json'}, body: JSON.stringify({url})});
    if (!r.ok) throw new Error('le serveur a refusé (' + r.status + ')');
    id = (await r.json()).id;
  } catch (err) {
    setState(0, 'running');
    onEvent({etape: 'analyse', termine: true, succes: false, message: String(err && err.message || err)});
    return;
  }
  run.id = id;
  brancher();
}
/* Le champ accepte une adresse ou un nom. Coller une URL suppose de l'avoir
   déjà trouvée ; beaucoup de gens connaissent le nom de l'outil qu'ils veulent
   et pas l'adresse de son dépôt. */
$('#form').addEventListener('submit', e => {
  e.preventDefault();
  const v = $('#url').value.trim();
  if (isRepo(v)) { $('#trouvailles').hidden = true; start(v); }
  else chercherDepot(v);
});

async function chercherDepot(terme) {
  const hint = $('#form-hint'), ul = $('#trouvailles');
  if (terme.length < 2) {
    hint.className = 'hint err';
    hint.textContent = tr('deux_lettres');
    return;
  }
  hint.className = 'hint'; hint.textContent = tr('recherche');
  ul.hidden = false;
  ul.replaceChildren(h('li', {class: 'empty', text: tr('recherche')}));

  let d;
  try { d = await (await fetch(RACINE + 'recherche?q=' + encodeURIComponent(terme))).json(); }
  catch (e) { hint.className = 'hint err'; hint.textContent = String(e); ul.hidden = true; return; }

  const list = Array.isArray(d) ? d : [];
  if (!list.length) {
    hint.className = 'hint err';
    hint.textContent = tr('aucun_depot') + ' « ' + terme + ' ».';
    ul.hidden = true;
    return;
  }
  hint.textContent = list.length + ' dépôtr(s).';
  ul.replaceChildren(...list.map(t => {
    const b = badge(t.depot);
    const choisir = h('button', {class: 'btn sm ghost', type: 'button', text: 'Empaqueter',
      onclick: () => { ul.hidden = true; hint.textContent = ''; start(t.depot); }});
    const li = h('li', {class: 'item'},
      icone(t.depot),
      h('div', {},
        h('div', {class: 'nm', text: t.nom || '—'}),
        t.description ? h('div', {class: 'ds', text: t.description}) : null,
        h('div', {class: 'mt'},
          t.etoiles ? h('span', {class: 'm', title: tr('etoiles')}, icone_('etoile'), nf.format(t.etoiles)) : null,
          h('span', {class: 'lic', text: t.origine}),
          t.deja_package ? h('span', {class: 'etiq pack'}, icone_('check'), tr('deja_cat')) : null),
        h('div', {class: 'mt'}, ...liens(t))),
      b || h('span'),
      choisir);
    if (b) observer(b, t.depot);
    return li;
  }));
  remplirDepuisLeCache(list.map(t => t.depot));
}

/* ——— Faisabilite : cache cote serveur, demande a la demande ———
   Evaluer un depot coute trois appels a l'API GitHub, qui en accorde soixante
   par heure sans jeton. On ne demande donc que ce que l'utilisateur regarde
   vraiment — une ligne visible — et le serveur retient le resultat. */
const fiches = new Map();          /* depot -> fiche */
const demandees = new Set();       /* depots deja mis en file */
let scrutation = null;

function depotDe(url) {
  try {
    const u = new URL(String(url));
    const p = u.pathname.replace(/\.git$/, '').split('/').filter(Boolean);
    return p.length >= 2 ? (p[0] + '/' + p[1]).toLowerCase() : null;
  } catch { return null; }
}

const VERDICTS = {
  'FAISABLE': ['feasible', s => s + '/100'],
  'FAISABLE AVEC TRAVAIL': ['work', s => s + '/100'],
  'NON FAISABLE': ['no', () => 'non']
};

function badge(repo, packagee) {
  const b = h('button', {class: 'fais', type: 'button', 'data-v': 'pending', text: '…',
                         title: tr('pas_examine')});
  const d = depotDe(repo);
  if (!d) { b.textContent = '—'; b.title = 'dépôt non reconnu'; return b; }
  b.dataset.depot = d;
  /* Pour une application déjà au catalogue, la compatibilité n'a plus d'objet.
     La manière dont son projet est tenu, si : c'est ce qui aide à choisir
     entre deux outils qui font la même chose. */
  if (packagee) b.dataset.pack = 'oui';
  majBadge(b);
  return b;
}

function majBadge(b) {
  const f = fiches.get(b.dataset.depot);
  if (!f) return;
  if (f.etat === 'echouee') {
    b.dataset.v = 'pending'; b.textContent = '—';
    b.title = tr('non_examine') + ' ' + f.erreur;
    return;
  }
  if (b.dataset.pack) {
    b.dataset.v = 'feasible';
    badgeTexte(b, 'oeil', tr('le_projet'));
    b.title = tr('projet_tenu');
  } else {
    const [v, fmt] = VERDICTS[f.verdict] || ['pending', s => String(s)];
    b.dataset.v = v;
    badgeTexte(b, {feasible: 'check', work: 'alerte', no: 'croix'}[v], fmt(f.score));
    b.title = f.verdict.toLowerCase() + (f.technologie ? ' · ' + f.technologie : '');
  }
  b.classList.add('cliquable');
  b.onclick = () => basculerDetail(b, f);
}

/* Ce qu'on peut établir de la conduite d'un projet sans rien deviner.

   Aucune base libre n'encode la gouvernance d'un logiciel : personne ne
   maintient un champ « ce projet est piloté par une société ». Ces faits-là,
   eux, sont lisibles par une machine, et chacun en tire ses conclusions. */
function gouvernance(f) {
  const g = f.gouvernance || {};
  const traits = [];
  if (f.archive) traits.push([tr('archive'), tr('archive_p'), 'archive']);
  if (g.fourche_de) traits.push([tr('fourche') + ' ' + g.fourche_de, tr('fourche_p'), 'fourche']);
  if (g.proprietaire_collectif === true) traits.push([tr('orga'), tr('orga_p'), 'groupe']);
  if (g.proprietaire_collectif === false) traits.push([tr('perso'), tr('perso_p'), 'personne']);
  if (g.chartes && g.chartes.length) traits.push([g.chartes, tr('chartes_p'), 'livre']);
  else traits.push([tr('sans_charte'), tr('sans_charte_p'), 'alerte']);
  if (f.etoiles) traits.push([nf.format(f.etoiles) + ' ' + tr('etoiles'), tr('audience'), 'etoile']);

  const bloc = h('div', {class: 'gouv'},
    h('div', {class: 'gouv-t', text: tr('conduite')}),
    h('ul', {}, traits.map(([quoi, pourquoi, ic]) =>
      h('li', {}, icone_(ic), h('span', {},
        Array.isArray(quoi)
          ? h('span', {class: 'q fichiers'}, quoi.map(f => h('code', {class: 'nomf', title: f, text: f})))
          : h('span', {class: 'q', text: quoi}),
        h('span', {class: 'p', text: pourquoi}))))));

  /* Notes publiées par la fondation OpenSSF. Elle ne passe en revue qu'une
     partie des dépôts GitHub : l'absence de note ne dit rien du projet. */
  const sc = g.scorecard;
  if (sc && sc.criteres && sc.criteres.length) {
    bloc.append(
      h('div', {class: 'gouv-t', style: 'margin-top:10px'},
        tr('revue') + ' — ', h('b', {text: (sc.dixiemes / 10).toFixed(1) + '/10'}),
        sc.date ? ' · ' + sc.date : ''),
      h('div', {class: 'notes'}, sc.criteres.map(c =>
        h('div', {class: 'critere'},
          h('span', {class: 'n', text: c.nom}),
          h('span', {class: 'jauge', 'data-n': c.note >= 7 ? 'bon' : c.note >= 4 ? 'moyen' : 'faible'},
            h('i', {style: 'width:' + (c.note * 10) + '%'})),
          h('span', {class: 'v', text: c.note + '/10'})))));
  }
  return bloc;
}

/* L'age d'une evaluation, parce qu'une evaluation ancienne peut avoir ete
   depassee par une mise a jour amont. Verifier automatiquement couterait un
   appel d'API par depot, ce que le quota interdit sur cinq cents lignes : on
   affiche l'age et on laisse reevaluer d'un clic. */
function age(secondes) {
  const j = Math.floor((Date.now() / 1000 - Number(secondes)) / 86400);
  if (!isFinite(j) || j < 0) return '';
  if (j === 0) return "aujourd'hui";
  if (j === 1) return 'hier';
  if (j < 31) return 'il y a ' + j + ' jours';
  return 'il y a ' + Math.floor(j / 30) + ' mois';
}

function basculerDetail(b, f) {
  const item = b.closest('.item');
  const deja = item.querySelector('.pourquoi');
  if (deja) { deja.remove(); return; }
  /* Le constat est retenu dans les trois langues ; celle qui manque retombe
     sur le français, qui vient de la règle elle-même. */
  const dit = (m, champ) => (m.textes && m.textes[LANGUE] && m.textes[LANGUE][champ]) || m[champ];
  const motif = ic => m => h('li', {class: 'm-' + ic},
    technique ? h('code', {class: 'code', text: m.id}) : icone_(ic),
    h('span', {}, h('span', {text: dit(m, 'titre')}),
      dit(m, 'remede') ? h('span', {class: 'rm', text: dit(m, 'remede')}) : null));
  const refaire = h('button', {class: 'btn sm plain', type: 'button', text: tr('reevaluer'),
    onclick: async () => {
      refaire.disabled = true; refaire.textContent = tr('en_file');
      fiches.delete(b.dataset.depot); demandees.add(b.dataset.depot);
      b.dataset.v = 'pending'; b.textContent = '…';
      item.querySelector('.pourquoi').remove();
      await fetch(RACINE + 'evaluations', {method: 'POST', headers: {'content-type': 'application/json'},
        body: JSON.stringify({url: b.dataset.repo, refaire: true})}).catch(() => {});
      planifier();
    }});
  const panneau = h('div', {class: 'pourquoi'},
    h('ul', {}, f.bloquants.map(motif('croix')), f.reserves.map(motif('alerte')), (f.remarques || []).map(motif('info'))),
    gouvernance(f),
    h('div', {class: 'quand'},
      h('span', {}, tr('examine_sur') + ' ' + (f.reference || '?') +
        (f.evalue_le ? ', ' + age(f.evalue_le) : ''), ' · ', lienTechnique()),
      refaire));
  item.append(panneau);
}

/* Ne demande que ce qui entre dans le champ de vision, et s'arrete des que la
   ligne est connue : la file du serveur est bornee, l'inonder ferait perdre
   les demandes qui comptent. */
const vue = new IntersectionObserver(entrees => {
  for (const e of entrees) {
    if (!e.isIntersecting) continue;
    const b = e.target;
    vue.unobserve(b);
    const d = b.dataset.depot;
    if (!d || fiches.has(d) || demandees.has(d)) continue;
    demandees.add(d);
    fetch(RACINE + 'evaluations', {method: 'POST', headers: {'content-type': 'application/json'},
                                   body: JSON.stringify({url: b.dataset.repo})}).catch(() => {});
    planifier();
  }
}, {rootMargin: '200px'});

function observer(b, repo) {
  if (!b.dataset.depot) return;
  b.dataset.repo = repo;
  if (fiches.has(b.dataset.depot)) { majBadge(b); return; }
  vue.observe(b);
}

/* Ce que le serveur sait déjà, en une seule requête, dès l'affichage.
   Attendre le cycle de scrutation laissait les badges à « … » une dizaine de
   secondes alors que la réponse était immédiate. */
async function remplirDepuisLeCache(depots) {
  const inconnus = depots.filter(d => d && !fiches.has(depotDe(d) || ''));
  if (!inconnus.length) return;
  try {
    const d = await (await fetch(RACINE + 'evaluations?depots=' +
      encodeURIComponent(inconnus.slice(0, 80).join(',')))).json();
    for (const f of d.fiches || []) fiches.set(f.depot, f);
  } catch (e) { return; }
  document.querySelectorAll('.fais[data-depot]').forEach(majBadge);
}

function planifier() {
  if (scrutation) return;
  scrutation = setInterval(rafraichir, 4000);
  rafraichir();
}

async function rafraichir() {
  const attendus = [...document.querySelectorAll('.fais[data-depot]')]
    .filter(b => !fiches.has(b.dataset.depot) && demandees.has(b.dataset.depot));
  if (!attendus.length) { clearInterval(scrutation); scrutation = null; return; }
  const urls = attendus.map(b => b.dataset.repo).slice(0, 60).join(',');
  try {
    const d = await (await fetch(RACINE + 'evaluations?depots=' + encodeURIComponent(urls))).json();
    for (const f of d.fiches || []) fiches.set(f.depot, f);
  } catch { return; }
  document.querySelectorAll('.fais[data-depot]').forEach(majBadge);
}

function icone(repo) {
  const img = h('img', {class: 'ico', alt: '', loading: 'lazy', decoding: 'async',
                        src: RACINE + 'icone?depot=' + encodeURIComponent(repo)});
  img.addEventListener('error', () => { img.hidden = true; });
  return img;
}

/* ——— Liste de souhaits ——— */
let wish = null, wishLimit = 50;
function packBtn(repo, analysable) {
  const u = repo && isRepo(String(repo)) ? String(repo) : null;
  const ok = u && analysable !== false;
  return h('button', {class: 'btn sm ghost', type: 'button', disabled: !ok,
    text: ok ? tr('empaqueter') : u ? tr('forge_non') : tr('depot_inconnu'),
    onclick: () => { show('run', true); window.scrollTo(0, 0); start(u); }});
}
/* Un lien devient un bouton à icône : plus facile à viser qu'une adresse
   tronquée, et le nom reste lisible par un lecteur d'écran. */
function lienBouton(url, icone, libelle) {
  const u = safeUrl(url);
  if (!u) return null;
  return h('a', {class: 'btn sm plain lien', href: u, target: '_blank',
                 rel: 'noopener noreferrer', title: libelle, 'aria-label': libelle},
    icone_(icone));
}

function liens(o) {
  return [
    lienBouton(o.repo || o.depot, 'code', tr('code')),
    lienBouton(o.site, 'site', tr('site')),
    o.qualite && o.qualite.id
      ? lienBouton('https://apps.yunohost.org/app/' + encodeURIComponent(o.qualite.id), 'paquet', tr('fiche'))
      : null
  ].filter(Boolean);
}

/* Ce que le catalogue YunoHost dit de la qualité du paquet : de 0, qui ne
   s'installe pas, à 8, qui s'installe, se met à jour et se sauvegarde sans
   reproche. Savoir qu'une application existe ne dit pas si elle est bien
   empaquetée. */
/* Un paquet deja au catalogue qui n'atteint pas le niveau maximal peut
   souvent y arriver : sept cents applications sont deja la, et les refaire de
   zero serait du gachis. Ce bouton dit ce qui leur manque. */
function boutonExamen(q) {
  if (!q || !q.id) return null;
  const b = h('button', {class: 'btn sm plain', type: 'button', text: tr('examiner')});
  b.onclick = async () => {
    const item = b.closest('.item');
    const deja = item.querySelector('.audit');
    if (deja) { deja.remove(); return; }
    b.disabled = true; b.textContent = tr('examen');
    let d;
    try { d = await (await fetch(RACINE + 'audit?q=' + encodeURIComponent(q.id))).json(); }
    catch (e) { d = {erreur: String(e)}; }
    b.disabled = false; b.textContent = tr('examiner');
    item.append(bilanAudit(d));
  };
  return b;
}

function bilanAudit(d) {
  if (d.erreur) return h('div', {class: 'audit'}, h('p', {class: 'hint err', text: d.erreur}));
  if (!d.constats || !d.constats.length) {
    return h('div', {class: 'audit'}, h('p', {class: 'audit-ok', text: tr('audit_rien')}));
  }
  return h('div', {class: 'audit'},
    h('div', {class: 'gouv-t'}, tr('audit_t'),
      ' — ', tr('audit_atteignable'), ' ', h('b', {text: d.niveau_atteignable + '/8'})),
    d.niveau_atteignable < 8 ? h('p', {class: 'audit-note', text: tr('pas_huit')}) : null,
    h('ul', {}, d.constats.map(c => h('li', {class: c.bloque_le_niveau ? 'm-croix' : 'm-alerte'},
      technique ? h('code', {class: 'code', text: c.id}) : icone_(c.bloque_le_niveau ? 'croix' : 'alerte'),
      h('span', {},
        h('span', {text: c.quoi}),
        h('span', {class: 'rm', text: c.remede}),
        h('span', {class: 'audit-m'},
          c.bloque_le_niveau ? h('span', {class: 'etiq mort',
            text: tr('audit_bloque') + ' ' + c.bloque_le_niveau}) : null,
          c.reparable ? h('span', {class: 'etiq pack', text: tr('audit_reparable')}) : null))))),
    h('div', {class: 'quand'}, lienTechnique(), boutonContribuer(d)));
}

/* Proposer le correctif au mainteneur. Rien n'est fusionne : c'est lui qui
   décide. Un outil qui modifierait directement le paquet de quelqu'un
   d'autre serait indéfendable, même quand il a raison. */
function boutonContribuer(d) {
  const mecaniques = (d.constats || []).filter(c => c.reparable).length;
  if (!mecaniques) return null;
  const b = h('button', {class: 'btn sm ghost', type: 'button',
    text: tr('contribuer') + ' (' + mecaniques + ')',
    title: tr('contribuer_aide')});
  b.onclick = async () => {
    b.disabled = true; b.textContent = tr('contribution');
    let r, c;
    try {
      r = await fetch(RACINE + 'contribuer', {method: 'POST',
        headers: {'content-type': 'application/json'},
        body: JSON.stringify({app: d.app})});
      c = await r.json();
    } catch (e) { c = {erreur: String(e)}; r = {ok: false}; }
    const parent = b.parentNode;
    b.remove();
    if (!r.ok || c.erreur) {
      parent.append(h('span', {class: 'hint err', text: c.erreur || tr('refuse')}));
      return;
    }
    parent.append(h('a', {class: 'btn sm', href: c.demande, target: '_blank',
      rel: 'noopener noreferrer', text: tr('demande_ouverte')}));
  };
  return b;
}

function niveauPaquet(q) {
  if (!q) return null;
  const n = q.niveau;
  const etat = n == null ? 'inconnu' : q.solide ? 'bon' : n >= 2 ? 'moyen' : 'faible';
  return h('span', {class: 'niv', 'data-e': etat,
                    title: tr('paquet_yh') + ' ' + q.ce_que_dit_le_niveau},
    n == null ? tr('non_note') : tr('niveau') + ' ' + n + '/8');
}
function loadWish() {
  if (wish) return;
  wish = [];
  $('#wish-list').replaceChildren(h('li', {class: 'empty', text: tr('chargement')}));
  fetch(API.wishlist).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
   .then(d => { wish = Array.isArray(d) ? d : []; $('#wish-n').textContent = wish.length; renderWish(); })
   .catch(() => { wish = null; $('#wish-list').replaceChildren(h('li', {class: 'empty', text: tr('indispo')})); });
}
function renderWish() {
  const q = norm($('#wish-q').value);
  const f = wish.filter(a => !q || norm((a.name || '') + ' ' + (a.description || '')).includes(q));
  /* Une demande dont l'application est arrivée au catalogue devrait être
     retirée de la liste mère. La signaler est le seul moyen de le voir. */
  const perimes = wish.filter(a => a.deja_package).length;
  $('#wish-c').textContent = q
    ? f.length + ' / ' + wish.length
    : wish.length + ' ' + tr('demandes') + (perimes ? ' · ' + perimes + ' déjà au catalogue' : '');
  const ul = $('#wish-list');
  ul.replaceChildren(...f.slice(0, wishLimit).map(a => {
    const b = a.analysable ? badge(a.repo, a.deja_package) : null;
    const li = h('li', {class: 'item'},
      a.repo ? icone(a.repo) : h('span', {class: 'ico'}),
      h('div', {},
        h('div', {class: 'nm'}, a.name || '—',
          a.votes ? h('span', {class: 'votes'}, icone_('coeur'), a.votes) : null,
          a.deja_package ? h('span', {class: 'etiq pack', title: 'la demande peut être retirée de la liste'},
                                      icone_('check'), tr('deja_cat')) : null,
          niveauPaquet(a.qualite)),
        a.description ? h('div', {class: 'ds', text: a.description}) : null,
        h('div', {class: 'mt'},
          ...liens(a),
          a.repo ? null : h('span', {text: tr('pas_depot')}),
          a.en_cours ? h('span', {text: tr('en_cours_ailleurs')}) : null)),
      b || h('span'),
      a.deja_package
        ? (boutonExamen(a.qualite) || h('button', {class: 'btn sm plain', type: 'button',
            text: tr('deja_dispo'), disabled: true}))
        : packBtn(a.repo, a.analysable));
    if (b) observer(b, a.repo);
    return li;
  }));
  remplirDepuisLeCache(f.slice(0, wishLimit).map(a => a.repo));
  if (!f.length) ul.append(h('li', {class: 'empty', text: tr('aucune_corresp') + ' « ' + $('#wish-q').value + ' ».'}));
  const more = $('#wish-more'); more.textContent = '';
  if (f.length > wishLimit) more.append(h('button', {class: 'btn plain sm', type: 'button', text: tr('afficher_suivantes') + ' ' + Math.min(50, f.length - wishLimit) + ' ' + tr('suivantes'), onclick: () => { wishLimit += 50; renderWish(); }}));
}
$('#wish-q').addEventListener('input', () => { wishLimit = 50; if (wish) renderWish(); });

/* ——— Alternatives ——— */

/* Suggestions : la liste des noms connus, chargée une fois et partagée par les
   deux champs de recherche. Sans elle, il faut deviner l'orthographe exacte
   d'un logiciel pour le trouver. */
let noms = null;

function chargerNoms() {
  if (noms) return;
  noms = [];
  fetch(RACINE + 'suggestions').then(r => r.ok ? r.json() : []).then(d => { noms = Array.isArray(d) ? d : []; }).catch(() => {});
}

/* Branche un champ de saisie sur la liste des noms.
   `valider` est appelé quand l'utilisateur en choisit un. */
function brancherSuggestions(champ, liste, valider) {
  let choisie = -1;

  const fermer = () => {
    liste.hidden = true; liste.textContent = ''; choisie = -1;
    champ.setAttribute('aria-expanded', 'false');
  };

  const montrer = () => {
    const q = norm(champ.value);
    /* Une adresse n'a pas besoin d'être devinée. */
    if (!q || isRepo(champ.value) || !noms || !noms.length) return fermer();
    /* Ceux qui commencent par le terme d'abord : taper « nex » cherche
       Nextcloud, pas un logiciel dont la description le mentionne. */
    const debut = [], dedans = [];
    for (const n of noms) {
      const x = norm(n);
      if (x.startsWith(q)) debut.push(n);
      else if (x.includes(q)) dedans.push(n);
      if (debut.length >= 10) break;
    }
    const trouves = debut.concat(dedans).slice(0, 10);
    if (!trouves.length || (trouves.length === 1 && norm(trouves[0]) === q)) return fermer();
    liste.replaceChildren(...trouves.map(n => h('button', {type: 'button', role: 'option', text: n,
      onmousedown: e => { e.preventDefault(); champ.value = n; fermer(); valider(); }})));
    liste.hidden = false; choisie = -1;
    champ.setAttribute('aria-expanded', 'true');
  };

  champ.addEventListener('input', () => { chargerNoms(); montrer(); });
  champ.addEventListener('focus', chargerNoms);
  champ.addEventListener('blur', () => setTimeout(fermer, 120));
  champ.addEventListener('keydown', e => {
    if (liste.hidden) return;
    const opts = [...liste.children];
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      choisie = (choisie + (e.key === 'ArrowDown' ? 1 : -1) + opts.length) % opts.length;
      opts.forEach((o, i) => o.setAttribute('aria-selected', i === choisie));
      opts[choisie].scrollIntoView({block: 'nearest'});
    } else if (e.key === 'Enter' && choisie >= 0) {
      e.preventDefault(); champ.value = opts[choisie].textContent; fermer(); valider();
    } else if (e.key === 'Escape') fermer();
  });

  return fermer;
}

const altQ = $('#alt-q');
const fermerSug = brancherSuggestions(altQ, $('#alt-sug'), () => chercherAlt());
brancherSuggestions($('#url'), $('#url-sug'), () => $('#form').requestSubmit());

function etiquettes(a) {
  const e = [];
  if (a.deja_package) e.push(h('span', {class: 'etiq pack'}, icone_('check'), tr('deja_cat')));
  if (a.abandonne) {
    const j = a.jours_sans_activite;
    e.push(h('span', {class: 'etiq mort', title: 'dernière activité connue : ' + (a.derniere_activite || 'inconnue')},
                      icone_('archive'), 'sans activité depuis ' + Math.floor(j / 365) + ' ans'));
  }
  if (a.libre === false) e.push(h('span', {class: 'etiq nonlibre', title: 'hors des licences que le catalogue YunoHost accepte'},
                                           icone_('alerte'), 'licence à vérifier'));
  return e;
}

/* Le bouton suit ce qui est tapé : si nos résultats ne conviennent pas, un
   clic relance la même recherche ailleurs. */
function majAilleurs() {
  const q = altQ.value.trim();
  $('#alt-ailleurs').href = q
    ? 'https://alternativeto.net/browse/search/?q=' + encodeURIComponent(q)
    : 'https://alternativeto.net/';
}
altQ.addEventListener('input', majAilleurs);

function chercherAlt() {
  const q = altQ.value.trim(); if (!q) return;
  fermerSug(); majAilleurs();
  const ul = $('#alt-list');
  ul.hidden = false;
  ul.replaceChildren(h('li', {class: 'empty', text: tr('recherche')}));

  fetch(API.alternatives(q)).then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(d => {
    const list = Array.isArray(d) ? d : [];
    if (!list.length) { ul.replaceChildren(h('li', {class: 'empty', text: tr('aucune_alt') + ' « ' + q + ' ».'})); return; }
    ul.replaceChildren(...list.map(a => {
      const b = badge(a.repo, a.deja_package);
      const li = h('li', {class: 'item'},
        a.repo ? icone(a.repo) : h('span', {class: 'ico'}),
        h('div', {},
          h('div', {class: 'nm'}, a.name || '—', niveauPaquet(a.qualite)),
          a.description ? h('div', {class: 'ds', text: a.description}) : null,
          h('div', {class: 'mt'}, a.stars ? h('span', {class: 'm', title: tr('etoiles')}, icone_('etoile'), nf.format(a.stars)) : null,
            a.license ? h('span', {class: 'm'}, icone_('balance'), a.license) : null, ...etiquettes(a)),
          h('div', {class: 'mt'}, ...liens(a))),
        b || h('span'),
        a.deja_package
          ? (boutonExamen(a.qualite) || h('button', {class: 'btn sm plain', type: 'button',
              text: tr('deja_dispo'), disabled: true}))
          : packBtn(a.repo, a.analysable));
      observer(b, a.repo);
      return li;
    }));
    remplirDepuisLeCache(list.map(a => a.repo));
  }).catch(() => ul.replaceChildren(h('li', {class: 'empty', text: tr('indispo')})));
}

$('#alt-form').addEventListener('submit', e => { e.preventDefault(); chercherAlt(); });

/* Le lien qui montre ou cache les identifiants techniques. Il apparaît là où
   ces identifiants servent — dans un panneau de détail, dans le formulaire —
   plutôt qu'isolé en haut de page où il ne veut rien dire. L'état est unique
   et mémorisé : un seul texte à maintenir, pas deux versions qui divergent. */
function lienTechnique() {
  const a = h('button', {class: 'bascule', type: 'button',
    text: tr(technique ? 'tech_off' : 'tech_on')});
  a.onclick = () => {
    technique = !technique;
    try { localStorage.setItem('yunopack:technique', technique ? 'oui' : 'non'); } catch (e) {}
    redessiner();
  };
  return a;
}

/* Redessine ce qui est ouvert. Rien n'est rechargé depuis le serveur. */
function redessiner() {
  document.querySelectorAll('.pourquoi').forEach(d => {
    const b = d.closest('.item').querySelector('.fais[data-depot]');
    d.remove();
    if (b) { const f = fiches.get(b.dataset.depot); if (f) basculerDetail(b, f); }
  });
  const ask = document.querySelector('form.ask');
  if (ask && run && run.arbitrages) { ask.remove(); renderAsk(run.arbitrages); }
}

/* Le HTML porte des points d'ancrage plutôt que du texte : une seule source
   pour les trois langues, et rien à tenir en double dans le balisage. */
document.querySelectorAll('[data-t]').forEach(e => { e.textContent = tr(e.dataset.t); });
document.querySelectorAll('[data-ph]').forEach(e => { e.placeholder = tr(e.dataset.ph); });
document.querySelectorAll('[data-i]').forEach(e => { e.prepend(icone_(e.dataset.i)); });

/* Thème : trois positions, mémorisées dans le navigateur. « auto » efface le choix. */
const themeEl = $('#theme');
themeEl.setAttribute('aria-label', tr('th'));
function appliquerTheme(v) {
  const r = document.documentElement;
  if (v === 'light' || v === 'dark') r.dataset.theme = v; else { v = 'auto'; delete r.dataset.theme; }
  themeEl.querySelectorAll('button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === v));
  return v;
}
appliquerTheme(document.documentElement.dataset.theme);
themeEl.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  const v = appliquerTheme(b.dataset.v);
  try { v === 'auto' ? localStorage.removeItem('yunopack:theme') : localStorage.setItem('yunopack:theme', v); } catch (e) {}
});

window.addEventListener('hashchange', fromHash);
fromHash();
})();
