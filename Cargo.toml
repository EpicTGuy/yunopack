[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.8.1"
edition = "2021"
rust-version = "1.79"
license = "AGPL-3.0-or-later"
repository = "https://github.com/etg/yunopackage"

[workspace.dependencies]
# --- coeur ---
ynp-core       = { path = "crates/ynp-core" }
ynp-forge      = { path = "crates/ynp-forge" }
ynp-dockerfile = { path = "crates/ynp-dockerfile" }
ynp-analyze    = { path = "crates/ynp-analyze" }
ynp-rules      = { path = "crates/ynp-rules" }
ynp-spec       = { path = "crates/ynp-spec" }
ynp-gen        = { path = "crates/ynp-gen" }
ynp-verify     = { path = "crates/ynp-verify" }
ynp-runner     = { path = "crates/ynp-runner" }
ynp-publish    = { path = "crates/ynp-publish" }

# --- externes ---
anyhow      = "1"
thiserror   = "2"
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
toml        = "0.8"
toml_edit   = "0.22"
tera        = { version = "1", default-features = false }
reqwest     = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio       = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util"] }
clap        = { version = "4", features = ["derive", "env"] }
jsonschema  = { version = "0.26", default-features = false }
sha2        = "0.10"
hex         = "0.4"
regex       = "1"
ignore      = "0.4"
tracing     = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
flate2      = "1"
tar         = "0.4"
serde_yaml  = "0.9"
time        = { version = "0.3", features = ["serde", "formatting", "parsing"] }
axum        = "0.7"
tower-http  = { version = "0.6", features = ["fs", "trace"] }
indexmap    = { version = "2", features = ["serde"] }

# --- dev ---
insta       = { version = "1", features = ["toml", "json"] }
assert_cmd  = "2"
wiremock    = "0.6"

[profile.release]
lto = "thin"
strip = true
